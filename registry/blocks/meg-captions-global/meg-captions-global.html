<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<div data-hf-id="hf-mgfb" id="sous-titres" data-composition-id="sous-titres" data-start="0" data-duration="15" data-start="0" data-width="1080" data-height="1920">
  <style>
    @font-face{font-family:'Clash Grotesk MEG';src:url('../assets/ClashGrotesk-Variable.woff2') format('woff2')}
    #sous-titres{position:relative;width:1080px;height:1920px;font-family:'Clash Grotesk MEG',sans-serif}
    #sous-titres .ancre-sous-titre{position:absolute;z-index:10;left:0;right:0;bottom:130px;display:flex;justify-content:center}
    #sous-titres .caption{display:inline-flex;width:fit-content;max-width:940px;padding:14px 28px;border-radius:28px;background:rgba(47,44,0,.86);color:#FFFCD6;font-size:58px;font-weight:700;line-height:1;letter-spacing:-.028em;word-spacing:.04em;text-align:center;white-space:nowrap;text-shadow:0 3px 0 #2F2C00,0 0 16px rgba(47,44,0,.7)}
  </style>
  <div data-hf-id="hf-ccwi" class="ancre-sous-titre"><div data-hf-id="hf-3ca2" class="caption" data-layout-allow-occlusion="">programme de formation</div></div>
  
  <script>
    window.__timelines=window.__timelines||{};
    const caption=document.querySelector('#sous-titres .caption');
    /* Capitale initiale : la transcription rend tout en minuscules, et un sous-titre
       qui commence en bas de casse fait brouillon. On ne passe pas tout en capitales
       pour autant — sur deux lignes serrées, ça se lit moins bien et ça crie.
       La suite de la phrase est laissée telle quelle : les noms propres, sigles et
       « EDOF » ou « RNCP » de la transcription restent intacts. */
    caption.textContent=caption.textContent.trim().replace(/^\p{Ll}/u,c=>c.toUpperCase());
    const fit=window.__hyperframes?.fitTextFontSize?.(caption.textContent.trim(),{maxWidth:884,baseFontSize:58,minFontSize:38,fontFamily:'Clash Grotesk MEG',fontWeight:700});
    if(fit?.fontSize)caption.style.fontSize=`${fit.fontSize}px`;
    const tl=gsap.timeline({paused:true});
    tl.from('#sous-titres .caption',{opacity:0,y:24,duration:.3,ease:'power2.out'},.1);
    window.__timelines['sous-titres']=tl;
  </script>
 </div>
</body>
</html>
