<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Badge — une gélule or tombe en haut (« À RETENIR », « ASTUCE »,
     « IMPORTANT »…). Remplacer le mot ; jamais sur les yeux (zone haute). -->
<div data-hf-id="hf-uv9y0" id="anim-badge-reel-root" data-composition-id="anim-badge-reel" data-start="0" data-duration="4" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #anim-badge-reel-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #anim-badge-reel-root .badge{position:absolute;z-index:30;left:46px;top:130px;padding:18px 38px;border-radius:999px;background:#B9AA02;color:#2F2C00;font-size:38px;font-weight:700;letter-spacing:.08em;box-shadow:0 16px 40px rgba(0,0,0,.3);opacity:0}
    </style>
    <div data-hf-id="hf-uv9y1" class="badge" data-layout-allow-occlusion="">À RETENIR</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#anim-badge-reel-root');
      const tl=gsap.timeline({paused:true});

      tl.fromTo(root.querySelector('.badge'),{y:-70,opacity:0},{y:0,opacity:1,duration:.5,ease:'back.out(1.6)'},.1)
        .to(root.querySelector('.badge'),{y:-40,opacity:0,duration:.35,ease:'power2.in'},3.5);
      window.__timelines['anim-badge-reel']=tl;
      })();
    </script>
  </div>
</body>
</html>
