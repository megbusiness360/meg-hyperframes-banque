<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Layout Reel à DEUX visages — côte à côte 50/50. Le master (vous) est recadré
     par le bloc ; la zone INVITÉ hachurée se remplace par le rush du second
     intervenant (réaction, duo, entretien). -->
<div data-hf-id="hf-yxuo0" id="reel-duo-visages-cote-a-cote-root" data-composition-id="reel-duo-visages-cote-a-cote" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-face-x="0" data-face-y="420" data-face-w="540" data-face-h="1080" data-face-r="0" data-face-mode="move">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-duo-visages-cote-a-cote-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-duo-visages-cote-a-cote-root .fond-scene{position:absolute;inset:0;z-index:1;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%)}
      #reel-duo-visages-cote-a-cote-root .invite{position:absolute;z-index:3;left:540px;top:420px;width:540px;height:1080px;box-sizing:border-box;border:7px solid #fffcd6;border-radius:34px;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#2F2C00;opacity:0}
#reel-duo-visages-cote-a-cote-root .invite .etiquette{padding:12px 26px;border-radius:22px;background:#2F2C00;color:#FFFCD6;font-size:34px;font-weight:700;letter-spacing:.05em}
#reel-duo-visages-cote-a-cote-root .invite .sous{font-size:26px;font-weight:600;opacity:.62}
#reel-duo-visages-cote-a-cote-root .face-cadre{position:absolute;z-index:5;border:7px solid #fffcd6;border-radius:34px;pointer-events:none;opacity:0}
#reel-duo-visages-cote-a-cote-root .standalone-face{display:none;position:absolute;z-index:2;left:0px;top:420px;width:540px;height:1080px;border-radius:0px;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
    </style>
    <div data-hf-id="hf-yxuo1" class="fond-scene" data-layout-allow-occlusion=""></div>
    <div data-hf-id="hf-yxuo2" class="invite" data-layout-allow-occlusion=""><span data-hf-id="hf-yxuo3" class="etiquette">INVITÉ — REMPLACER</span><span data-hf-id="hf-yxuo4" class="sous">rush du second intervenant</span></div>
    <div data-hf-id="hf-yxuo5" class="face-cadre" style="left:-7px;top:413px;width:554px;height:1094px;"></div>
    <div data-hf-id="hf-yxuo6" class="standalone-face" data-layout-allow-occlusion="">MASTER — VOUS</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-duo-visages-cote-a-cote-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Drag & drop pur : le bloc recadre le master lui-même. Entrée depuis
           le plein cadre, sortie qui LE RESTAURE — le bloc suivant repart
           toujours d'un master plein cadre. z-index 2 pendant le bloc : le
           master passe AU-DESSUS du fond de scène crème (z1) et SOUS les
           cartes du bloc (z3+). */
        tl.set(master,{zIndex:2},0)
          .fromTo(master,{x:0,y:0,width:1080,height:1920,borderRadius:0},
          {x:0,y:420,width:540,height:1080,borderRadius:0,duration:.42,ease:'power3.out'},0)
          .to(master,{x:0,y:0,width:1080,height:1920,borderRadius:0,duration:.42,ease:'power3.in'},5.58)
          .set(master,{clearProps:'zIndex'},6.00);
      }else{
        const sa=root.querySelector('.standalone-face');
        if(sa){sa.style.display='flex';tl.fromTo(sa,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'},0);}
      }
      tl.fromTo(root.querySelector('.invite'),{y:60,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.14)
        .to(root.querySelector('.invite'),{opacity:0,y:-40,duration:.35,ease:'power2.in'},5.60);
      const cadre=root.querySelector('.face-cadre');
      if(cadre)tl.fromTo(cadre,{opacity:0},{opacity:1,duration:.4},.2).to(cadre,{opacity:0,duration:.3},5.62);
      window.__timelines['reel-duo-visages-cote-a-cote']=tl;
      })();
    </script>
  </div>
</body>
</html>
