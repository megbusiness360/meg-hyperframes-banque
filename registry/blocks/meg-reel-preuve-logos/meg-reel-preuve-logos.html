<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Layout Reel preuve sociale — mur de 6 logos. Remplacer chaque tuile
     hachurée par un logo réel (clients, certifications, partenaires). -->
<div data-hf-id="hf-1ojg0" id="reel-preuve-logos-root" data-composition-id="reel-preuve-logos" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-face-x="0" data-face-y="1360" data-face-w="1080" data-face-h="560" data-face-r="0" data-face-mode="move">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-preuve-logos-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-preuve-logos-root .titre-mur{position:absolute;z-index:3;left:46px;top:70px;width:988px;text-align:center;color:#FFFCD6;font-size:58px;font-weight:700;letter-spacing:-.02em;text-shadow:0 6px 30px rgba(0,0,0,.55);opacity:0}
#reel-preuve-logos-root .tuile{position:absolute;z-index:3;width:474px;height:300px;box-sizing:border-box;border-radius:34px;border:7px solid #fffcd6;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#2F2C00;font-size:30px;font-weight:700;letter-spacing:.05em;opacity:0}
#reel-preuve-logos-root .standalone-face{display:none;position:absolute;z-index:2;left:0px;top:1360px;width:1080px;height:560px;border-radius:0px;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
#reel-preuve-logos-root .couture{position:absolute;z-index:4;left:0;top:1354px;width:100%;height:6px;background:#B9AA02;box-shadow:0 0 34px rgba(185,170,2,.55)}
    </style>
    <div data-hf-id="hf-1ojg1" class="titre-mur">Ils nous font confiance</div>
    <div data-hf-id="hf-1ojg2" class="tuile" style="left:46px;top:210px;" data-layout-allow-occlusion="">LOGO 1</div>
    <div data-hf-id="hf-1ojg3" class="tuile" style="left:550px;top:210px;" data-layout-allow-occlusion="">LOGO 2</div>
    <div data-hf-id="hf-1ojg4" class="tuile" style="left:46px;top:540px;" data-layout-allow-occlusion="">LOGO 3</div>
    <div data-hf-id="hf-1ojg5" class="tuile" style="left:550px;top:540px;" data-layout-allow-occlusion="">LOGO 4</div>
    <div data-hf-id="hf-1ojg6" class="tuile" style="left:46px;top:870px;" data-layout-allow-occlusion="">LOGO 5</div>
    <div data-hf-id="hf-1ojg7" class="tuile" style="left:550px;top:870px;" data-layout-allow-occlusion="">LOGO 6</div>
    <div data-hf-id="hf-1ojg8" class="couture"></div>
    <div data-hf-id="hf-1ojg9" class="standalone-face" data-layout-allow-occlusion="">MASTER — BANDE VISAGE</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-preuve-logos-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Drag & drop pur : le bloc recadre le master lui-même. Entrée depuis
           le plein cadre, sortie qui LE RESTAURE — le bloc suivant repart
           toujours d'un master plein cadre. */
        tl.fromTo(master,{x:0,y:0,width:1080,height:1920,borderRadius:0},
          {x:0,y:1360,width:1080,height:560,borderRadius:0,duration:.42,ease:'power3.out'},0)
          .to(master,{x:0,y:0,width:1080,height:1920,borderRadius:0,duration:.42,ease:'power3.in'},5.58);
      }else{
        const sa=root.querySelector('.standalone-face');
        if(sa){sa.style.display='flex';tl.fromTo(sa,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'},0);}
      }
      tl.fromTo(root.querySelector('.titre-mur'),{y:-30,opacity:0},{y:0,opacity:1,duration:.45,ease:'power3.out'},.06)
        .fromTo(root.querySelectorAll('.tuile'),{y:44,opacity:0,scale:.94},{y:0,opacity:1,scale:1,duration:.45,ease:'power3.out',stagger:.09},.2)
        .to([root.querySelector('.titre-mur'),...root.querySelectorAll('.tuile')],{opacity:0,duration:.35,ease:'power2.in'},5.60);
      window.__timelines['reel-preuve-logos']=tl;
      })();
    </script>
  </div>
</body>
</html>
