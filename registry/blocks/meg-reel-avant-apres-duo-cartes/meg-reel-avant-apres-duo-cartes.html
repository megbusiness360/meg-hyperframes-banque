<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Layout Reel AVANT/APRÈS — deux cartes inclinées. Les deux zones hachurées se
     remplacent par les captures ; le résultat (APRÈS) porte toujours le
     cadre crème, l'état de départ reste mat. -->
<div data-hf-id="hf-1ebx0" id="reel-avant-apres-duo-cartes-root" data-composition-id="reel-avant-apres-duo-cartes" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-face-x="0" data-face-y="1420" data-face-w="1080" data-face-h="500" data-face-r="0" data-face-mode="move">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-avant-apres-duo-cartes-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-avant-apres-duo-cartes-root .fond-scene{position:absolute;inset:0;z-index:1;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%)}
      #reel-avant-apres-duo-cartes-root .carte-av{position:absolute;z-index:3;width:470px;height:820px;box-sizing:border-box;border-radius:34px;display:flex;align-items:flex-start;justify-content:center;padding-top:50px;opacity:0}
#reel-avant-apres-duo-cartes-root .carte-av.avant{left:46px;top:200px;background:repeating-linear-gradient(-45deg,rgba(47,44,0,.16) 0 18px,rgba(47,44,0,.06) 18px 36px);border:5px dashed rgba(47,44,0,.4)}
#reel-avant-apres-duo-cartes-root .carte-av.apres{left:564px;top:330px;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);border:7px solid #fffcd6;box-shadow:0 40px 90px rgba(0,0,0,.4)}
#reel-avant-apres-duo-cartes-root .carte-av .tag{padding:12px 30px;border-radius:999px;background:#2F2C00;color:#FFFCD6;font-size:34px;font-weight:700;letter-spacing:.06em}
#reel-avant-apres-duo-cartes-root .carte-av.apres .tag{background:#B9AA02;color:#2F2C00}
#reel-avant-apres-duo-cartes-root .couture{position:absolute;z-index:4;left:0;top:1414px;width:100%;height:6px;background:#B9AA02;box-shadow:0 0 34px rgba(185,170,2,.55)}
#reel-avant-apres-duo-cartes-root .standalone-face{display:none;position:absolute;z-index:2;left:0px;top:1420px;width:1080px;height:500px;border-radius:0px;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
    </style>
    <div data-hf-id="hf-1ebx1" class="fond-scene" data-layout-allow-occlusion=""></div>
    <div data-hf-id="hf-1ebx2" class="carte-av avant" data-layout-allow-occlusion=""><span data-hf-id="hf-1ebx3" class="tag">AVANT</span></div>
    <div data-hf-id="hf-1ebx4" class="carte-av apres" data-layout-allow-occlusion=""><span data-hf-id="hf-1ebx5" class="tag">APRÈS</span></div>
    <div data-hf-id="hf-1ebx6" class="couture"></div>
    <div data-hf-id="hf-1ebx7" class="standalone-face" data-layout-allow-occlusion="">MASTER — BANDE VISAGE</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-avant-apres-duo-cartes-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Drag & drop pur : le bloc recadre le master lui-même. Entrée depuis
           le plein cadre, sortie qui LE RESTAURE — le bloc suivant repart
           toujours d'un master plein cadre. z-index 2 pendant le bloc : le
           master passe AU-DESSUS du fond de scène crème (z1) et SOUS les
           cartes du bloc (z3+). */
        tl.set(master,{zIndex:2},0)
          .fromTo(master,{x:0,y:0,width:1080,height:1920,borderRadius:0},
          {x:0,y:1420,width:1080,height:500,borderRadius:0,duration:.42,ease:'power3.out'},0)
          .to(master,{x:0,y:0,width:1080,height:1920,borderRadius:0,duration:.42,ease:'power3.in'},5.58)
          .set(master,{clearProps:'zIndex'},6.00);
        /* Biais visage : pendant le recadrage, la fenêtre cover vise le haut
           du rush (le visage), pas le centre géométrique. Valeur d'origine
           restaurée en sortie — le bloc suivant repart d'un master intact. */
        const vid=master.querySelector('video,img');
        if(vid){
          const op0=vid.style.objectPosition||getComputedStyle(vid).objectPosition||'50% 50%';
          tl.set(vid,{objectPosition:'50% 6%'},0).set(vid,{objectPosition:op0},6.00);
        }
      }else{
        const sa=root.querySelector('.standalone-face');
        if(sa){sa.style.display='flex';tl.fromTo(sa,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'},0);}
      }
      gsap.set(root.querySelector('.carte-av.avant'),{rotation:-4});gsap.set(root.querySelector('.carte-av.apres'),{rotation:3});
      tl.fromTo(root.querySelector('.carte-av.avant'),{y:70,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.08)
        .fromTo(root.querySelector('.carte-av.apres'),{y:90,opacity:0},{y:0,opacity:1,duration:.55,ease:'power3.out'},.3)
        .to(root.querySelectorAll('.carte-av'),{opacity:0,duration:.35,ease:'power2.in'},5.55);
      window.__timelines['reel-avant-apres-duo-cartes']=tl;
      })();
    </script>
  </div>
</body>
</html>
