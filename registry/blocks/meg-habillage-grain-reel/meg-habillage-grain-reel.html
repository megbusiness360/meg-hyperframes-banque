<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@700,600&f[]=cabinet-grotesk@400,700,800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>@font-face{font-family:'Clash Grotesk';src:url('https://cdn.fontshare.com/wf/MKEEQN57GWBZOSYWCRODNJOOZNPLMAKN/5SPTSZGHEACWWLF34DQ4WAA4OGU6PQIF/KN7DX4F6PXB74R6L2K2Y4NH3CB7FC53Q.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}@font-face{font-family:'Clash Grotesk';src:url('https://cdn.fontshare.com/wf/P6VJ47S3OYMUC7HYSJLTK7PEIK5O2NPQ/TK62VLUWA76PMTK2XWBNDZB7QVXJGYE3/I5W5NEJGYVFUC5I4XOXVET63OE5PSVHJ.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:'Cabinet Grotesk';src:url('https://cdn.fontshare.com/wf/J6PPRPKWXDUIYA47IXLEQB4R4OPVYDQH/N2ZXAXWEHVMLISD2TIXJC7EF4GOY43L4/NXM4Z4TDCMYWBZ7AVI2N6DQ5VMWNENMU.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:'Cabinet Grotesk';src:url('https://cdn.fontshare.com/wf/XMXWOHABYLQDJ42L65EFRYNVRY37HQCB/B2O4O6V3JMFM2WDCYQI3A47L5U4THDUL/WN5274VQ3AUBDFP74GB4EC4XYJ3EKVNE.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:'Cabinet Grotesk';src:url('https://cdn.fontshare.com/wf/ZX6AQLSFYVDPN2URWO2MQFGTYYOHIS64/TPYPKOYWFQVNJHLLRXD4KFYX4LUOUW4Z/6QH2ALVTTK7IRVO5MYOQQ3OZNXW5SSS3.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Habillage plein cadre — grain discret, vignette douce et light leak or.
     Aucun texte : la dérive du coin lumineux fait un aller-retour exactement
     sur huit secondes, avec un état final identique à l'état initial. -->
<div data-hf-id="hf-hgr0" id="habillage-grain-reel-root" data-composition-id="habillage-grain-reel" data-start="0" data-duration="8" data-width="1080" data-height="1920">
  <style>
    #habillage-grain-reel-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Cabinet Grotesk',sans-serif}
    #habillage-grain-reel-root .substitut{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);display:none}
    #habillage-grain-reel-root .grain{position:absolute;z-index:20;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,254,236,.3) .7px,rgba(255,254,236,0) 1px);background-size:5px 5px;opacity:0}
    #habillage-grain-reel-root .vignette{position:absolute;z-index:21;inset:0;pointer-events:none;box-shadow:inset 0 0 170px rgba(47,44,0,.35);opacity:0}
    #habillage-grain-reel-root .light-leak{position:absolute;z-index:22;left:48px;top:48px;width:74%;height:74%;pointer-events:none;background:radial-gradient(circle at 28% 28%,rgba(185,170,2,.15) 0%,rgba(185,170,2,.08) 28%,rgba(185,170,2,0) 70%);opacity:0}
  </style>
  <div data-hf-id="hf-hgr1" class="substitut" data-layout-allow-occlusion=""></div>
  <div data-hf-id="hf-hgr2" class="grain" data-layout-allow-occlusion=""></div>
  <div data-hf-id="hf-hgr3" class="vignette" data-layout-allow-occlusion=""></div>
  <div data-hf-id="hf-hgr4" class="light-leak" data-layout-allow-occlusion=""></div>
  <script>
    window.__timelines=window.__timelines||{};
    (()=>{
      const root=document.querySelector('#habillage-grain-reel-root');
      const tl=gsap.timeline({paused:true});
      const grain=root.querySelector('.grain');
      const vignette=root.querySelector('.vignette');
      const leak=root.querySelector('.light-leak');
      tl.fromTo(grain,{opacity:0},{opacity:.1,duration:.22,ease:'power2.out'},0)
        .fromTo(vignette,{opacity:0},{opacity:1,duration:.32,ease:'power2.out'},0)
        .fromTo(leak,{x:-28,y:-18,opacity:.06},{x:28,y:18,opacity:.15,duration:4,ease:'sine.inOut'},0)
        .fromTo(leak,{x:28,y:18,opacity:.15},{x:-28,y:-18,opacity:.06,duration:4,ease:'sine.inOut'},4);
      window.__timelines['habillage-grain-reel']=tl;
    })();
  </script>
</div>
</body>
</html>
