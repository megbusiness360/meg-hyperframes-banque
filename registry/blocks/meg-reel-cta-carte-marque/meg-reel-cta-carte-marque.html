<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- CTA/outro Reel — carte de marque plein cadre. Remplacer les textes ; l'appel à l'action
     reste indirect (règles MEG : on montre où continuer, on ne supplie pas). -->
<div data-hf-id="hf-l74r0" id="reel-cta-carte-marque-root" data-composition-id="reel-cta-carte-marque" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-cta-carte-marque-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-cta-carte-marque-root .fond{position:absolute;inset:0;z-index:3;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;color:#FFFCD6;text-align:center;opacity:0}
#reel-cta-carte-marque-root .marque{display:block;width:480px;height:auto;object-fit:contain}
#reel-cta-carte-marque-root .url-avant{font-size:56px;font-weight:700;color:#B9AA02;letter-spacing:.02em}
#reel-cta-carte-marque-root .invit{font-size:42px;font-weight:600;opacity:.85;max-width:820px;line-height:1.2}
    </style>
    <div data-hf-id="hf-l74r1" class="fond" data-layout-allow-occlusion=""><img data-hf-id="hf-l74r2" class="marque" src="assets/meg-logo-light.png" alt="Logo MEG Business 360"><div data-hf-id="hf-l74r3" class="invit">On regarde votre dossier ensemble sur</div><div data-hf-id="hf-l74r4" class="url-avant">megbusiness360.com</div></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-cta-carte-marque-root');
      const tl=gsap.timeline({paused:true});

      tl.fromTo(root.querySelector('.fond'),{opacity:0},{opacity:1,duration:.5,ease:'power2.out'},.05)
        .fromTo(root.querySelector('.marque'),{y:40,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.2)
        .fromTo(root.querySelector('.invit'),{y:30,opacity:0},{y:0,opacity:1,duration:.45,ease:'power3.out'},.42)
        .fromTo(root.querySelector('.url-avant'),{scale:.85,opacity:0},{scale:1,opacity:1,duration:.5,ease:'back.out(1.6)'},.62);
      window.__timelines['reel-cta-carte-marque']=tl;
      })();
    </script>
  </div>
</body>
</html>
