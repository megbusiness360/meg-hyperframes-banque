<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Habillage Reel — bandes haut et bas. Le master reste plein cadre, l'habillage
     se pose dessus (piste 2) et s'étire sur la durée voulue. -->
<div data-hf-id="hf-1wo90" id="reel-habillage-bandes-header-footer-root" data-composition-id="reel-habillage-bandes-header-footer" data-start="0" data-duration="6" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-habillage-bandes-header-footer-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-habillage-bandes-header-footer-root .bande-h{position:absolute;z-index:3;left:0;top:0;width:100%;height:140px;background:#FFFCD6;display:flex;align-items:center;justify-content:center;color:#2F2C00;font-size:40px;font-weight:700;letter-spacing:.08em;opacity:0}
#reel-habillage-bandes-header-footer-root .bande-b{position:absolute;z-index:3;left:0;bottom:0;width:100%;height:110px;background:#2F2C00;display:flex;align-items:center;justify-content:center;color:#B9AA02;font-size:34px;font-weight:700;letter-spacing:.06em;opacity:0}
    </style>
    <div data-hf-id="hf-1wo91" class="bande-h" data-layout-allow-occlusion="">MEG BUSINESS 360</div><div data-hf-id="hf-1wo92" class="bande-b" data-layout-allow-occlusion="">megbusiness360.com</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-habillage-bandes-header-footer-root');
      const tl=gsap.timeline({paused:true});

      tl.fromTo(root.querySelector('.bande-h'),{y:-140,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.05)
        .fromTo(root.querySelector('.bande-b'),{y:110,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.12);
      window.__timelines['reel-habillage-bandes-header-footer']=tl;
      })();
    </script>
  </div>
</body>
</html>
