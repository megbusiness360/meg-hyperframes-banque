<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Effet secousse — le cadre tremble une fois, amorti. Pour un chiffre
     choc ou une rupture de ton. Finit à x:0 : master intact. -->
<div data-hf-id="hf-38750" id="anim-secousse-reel-root" data-composition-id="anim-secousse-reel" data-start="0" data-duration="0.8" data-width="1080" data-height="1920">
    <style>
      #anim-secousse-reel-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
      #anim-secousse-reel-root .substitut{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);display:none}
    </style>
    <div data-hf-id="hf-38751" class="substitut" data-layout-allow-occlusion=""></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#anim-secousse-reel-root');
      const tl=gsap.timeline({paused:true});
      let cible=document.querySelector('#meg-master-frame');
      if(!cible){const s=root.querySelector('.substitut');if(s){s.style.display='block';cible=s;}}
      if(cible){
        /* Secousse amortie en px, finit à x:0 — master intact en sortie. */
        tl.to(cible,{x:-16,duration:.06,ease:'power1.inOut'},.05)
          .to(cible,{x:12,duration:.06,ease:'power1.inOut'},.12)
          .to(cible,{x:-7,duration:.05,ease:'power1.inOut'},.19)
          .to(cible,{x:0,duration:.08,ease:'power2.out'},.25);
      }
      
      window.__timelines['anim-secousse-reel']=tl;
      })();
    </script>
  </div>
</body>
</html>
