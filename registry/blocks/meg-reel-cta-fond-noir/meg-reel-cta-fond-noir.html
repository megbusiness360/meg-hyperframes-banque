<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- CTA/outro Reel "fond noir" — registre minimaliste : fond noir
     plein cadre, question et pastille contact alignées à gauche (même bord).
     Aucune carte ni logo, contraste maximal. Remplacer la question ; l'appel
     à l'action reste indirect (règles MEG : on montre où continuer, on ne
     supplie pas). -->
<div data-hf-id="hf-1jg10" id="reel-cta-fond-noir-root" data-composition-id="reel-cta-fond-noir" data-start="0" data-duration="4" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-cta-fond-noir-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-cta-fond-noir-root .fond{position:absolute;inset:0;z-index:3;background:#000000;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:52px;padding:0 84px;color:#FFFFFF;text-align:left;opacity:0}
#reel-cta-fond-noir-root .question{font-size:70px;font-weight:700;line-height:1.14;letter-spacing:-.01em}
#reel-cta-fond-noir-root .pastille-contact{display:flex;align-items:center;gap:18px;padding:24px 42px;border-radius:999px;background:linear-gradient(135deg,#FFFEEC 0%,#F4E9A8 100%);color:#2F2C00;font-size:34px;font-weight:700}
#reel-cta-fond-noir-root .pastille-contact svg{width:34px;height:34px;flex:none}
    </style>
    <div data-hf-id="hf-1jg11" class="fond" data-layout-allow-occlusion=""><div data-hf-id="hf-1jg12" class="question">Vous avez un dossier à faire avancer ?</div><div data-hf-id="hf-1jg13" class="pastille-contact"><svg data-hf-id="hf-1jg14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path data-hf-id="hf-1jg15" d="M3 6.5 12 13 21 6.5" stroke="#2F2C00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect data-hf-id="hf-1jg16" x="3" y="5" width="18" height="14" rx="2.5" stroke="#2F2C00" stroke-width="2"/></svg><span data-hf-id="hf-1jg17">megbusiness360.com</span></div></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-cta-fond-noir-root');
      const tl=gsap.timeline({paused:true});

      tl.fromTo(root.querySelector('.fond'),{opacity:0},{opacity:1,duration:.5,ease:'power2.out'},.05)
        .fromTo(root.querySelector('.question'),{y:30,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.22)
        .fromTo(root.querySelector('.pastille-contact'),{scale:.85,opacity:0},{scale:1,opacity:1,duration:.5,ease:'back.out(1.6)'},.5);
      window.__timelines['reel-cta-fond-noir']=tl;
      })();
    </script>
  </div>
</body>
</html>
