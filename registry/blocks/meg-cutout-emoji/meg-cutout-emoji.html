<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Corps détouré — pastilles en arc derrière le sujet.
     Sept jetons posés en arc autour de la tête : ceux du haut restent entiers, ceux du
     bas passent derrière les épaules. Sert à énumérer sans texte, en respiration.
     Détourage : `npx hyperframes remove-background <master>.mp4 -o cutout.webm`. -->
<div data-hf-id="hf-cem0" id="corps-detoure-pastilles-root" data-composition-id="corps-detoure-pastilles" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('../assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #corps-detoure-pastilles-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #corps-detoure-pastilles-root .voile{position:absolute;inset:0;z-index:1;backdrop-filter:blur(20px) saturate(.85);background:linear-gradient(180deg,rgba(47,44,0,.56) 0%,rgba(47,44,0,.76) 100%);opacity:0}
      #corps-detoure-pastilles-root .jeton{position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;width:186px;height:186px;border-radius:50%;background:#FFFCD6;color:#2F2C00;box-shadow:0 26px 58px rgba(0,0,0,.42);opacity:0}
      /* Pictos tracés, pas d'emoji : un emoji système impose ses couleurs (vert, rouge,
         bleu) et sort de la charte, en plus de dépendre de la police de la machine. */
      #corps-detoure-pastilles-root .jeton svg{width:92px;height:92px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
      /* Un jeton sur deux en encre : l'arc respire au lieu de faire un collier uniforme. */
      #corps-detoure-pastilles-root .jeton.ink{background:#2F2C00;color:#FFFCD6}
      #corps-detoure-pastilles-root .jeton.or{background:#B9AA02;color:#2F2C00}
      #corps-detoure-pastilles-root .j1{left:66px;top:640px}
      #corps-detoure-pastilles-root .j2{left:150px;top:376px}
      #corps-detoure-pastilles-root .j3{left:400px;top:212px}
      #corps-detoure-pastilles-root .j4{left:680px;top:290px}
      #corps-detoure-pastilles-root .j5{left:840px;top:534px}
      #corps-detoure-pastilles-root .j6{left:806px;top:834px}
      #corps-detoure-pastilles-root .j7{left:92px;top:918px}
      #corps-detoure-pastilles-root .sujet{position:absolute;inset:0;z-index:3;width:100%;height:100%;object-fit:cover}
    </style>
    <div data-hf-id="hf-cem1" class="voile"></div>
    <div data-hf-id="hf-cem2" class="jeton j1" title="Dossier"><svg data-hf-id="hf-cemb" viewBox="0 0 24 24"><path data-hf-id="hf-cemc" d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path data-hf-id="hf-cemd" d="M14 3v5h5M9 13h6M9 17h4"/></svg></div>
    <div data-hf-id="hf-cem3" class="jeton ink j2" title="Certification"><svg data-hf-id="hf-ceme" viewBox="0 0 24 24"><path data-hf-id="hf-cemf" d="M12 4 2 9l10 5 10-5z"/><path data-hf-id="hf-cemg" d="M6 11.5V17c0 1.7 2.7 3 6 3s6-1.3 6-3v-5.5M22 9v5"/></svg></div>
    <div data-hf-id="hf-cem4" class="jeton j3" title="Conforme"><svg data-hf-id="hf-cemh" viewBox="0 0 24 24"><circle data-hf-id="hf-cemi" cx="12" cy="12" r="9"/><path data-hf-id="hf-cemj" d="m8 12.4 2.8 2.8L16.4 9.6"/></svg></div>
    <div data-hf-id="hf-cem5" class="jeton or j4" title="Résultats"><svg data-hf-id="hf-cemk" viewBox="0 0 24 24"><path data-hf-id="hf-ceml" d="M4 20V4M4 20h16"/><path data-hf-id="hf-cemm" d="m8 15 3.5-4L14 13l4.5-5.5"/><path data-hf-id="hf-cemn" d="M19 7.5h-3.2M19 7.5v3.2"/></svg></div>
    <div data-hf-id="hf-cem6" class="jeton ink j5" title="Délai"><svg data-hf-id="hf-cemo" viewBox="0 0 24 24"><circle data-hf-id="hf-cemp" cx="12" cy="13" r="8"/><path data-hf-id="hf-cemq" d="M12 8.5V13l3 2M9.5 2h5M18.5 5.5 20 4"/></svg></div>
    <div data-hf-id="hf-cem7" class="jeton j6" title="Sécurisé"><svg data-hf-id="hf-cemr" viewBox="0 0 24 24"><rect data-hf-id="hf-cems" x="4.5" y="10.5" width="15" height="10.5" rx="2.5"/><path data-hf-id="hf-cemt" d="M8 10.5V7.5a4 4 0 0 1 8 0v3M12 14.5v2.5"/></svg></div>
    <div data-hf-id="hf-cem8" class="jeton or j7" title="Objectif"><svg data-hf-id="hf-cemu" viewBox="0 0 24 24"><circle data-hf-id="hf-cemv" cx="12" cy="12" r="8.5"/><circle data-hf-id="hf-cemw" cx="12" cy="12" r="4.6"/><circle data-hf-id="hf-cemx" cx="12" cy="12" r="1.1" fill="currentColor"/></svg></div>
    <video id="meg-cutout-emoji-video" data-hf-id="hf-cem9" class="clip sujet" src="../assets/cutout-demo.webm" data-start="0" data-duration="5" muted playsinline></video>
    <script>
      window.__timelines=window.__timelines||{};
      const cem=gsap.timeline({paused:true});
      cem.to('#corps-detoure-pastilles-root .voile',{opacity:1,duration:.34,ease:'power2.out'},0)
         .fromTo('#corps-detoure-pastilles-root .jeton',{scale:.42,opacity:0},{scale:1,opacity:1,duration:.38,stagger:.075,ease:'back.out(1.9)'},.12)
         .to('#corps-detoure-pastilles-root .jeton',{y:-14,duration:3.2,stagger:.06,ease:'none'},.9);
      window.__timelines['corps-detoure-pastilles']=cem;
    </script>
  </div>
</body>
</html>
