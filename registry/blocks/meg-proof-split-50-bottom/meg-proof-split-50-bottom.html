<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Partage à parts égales : visage en haut, preuve en bas. Miroir exact du
     bloc 50 haut ; l'entrée de la preuve vient du bas au lieu du haut. -->
<div data-hf-id="hf-p50v" id="preuve-bas-50-root" data-composition-id="preuve-bas-50" data-start="0" data-duration="5" data-start="0" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2')}
      #preuve-bas-50-root{position:relative;z-index:3;width:1080px;height:1920px;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #preuve-bas-50-root .proof{position:absolute;left:46px;bottom:46px;width:988px;height:903px;box-sizing:border-box;overflow:hidden;border:7px solid #fffcd6;border-radius:34px;background:#fffcd6;box-shadow:0 20px 60px rgba(0,0,0,.16);opacity:0}
      #preuve-bas-50-root .placeholder{display:flex;align-items:center;justify-content:center;padding:54px;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);color:#2f2c00;text-align:center;font-size:43px;line-height:1.02;font-weight:600;letter-spacing:-.035em}
      #preuve-bas-50-root .standalone-face{display:none;position:absolute;left:46px;top:46px;width:988px;height:903px;border-radius:34px;background:#2f2c00;color:#fffcd6;align-items:center;justify-content:center;text-align:center;font-size:52px;font-weight:700;letter-spacing:-.03em}
    </style>
    <div data-hf-id="hf-p50w" class="proof placeholder"><span data-hf-id="hf-p50x">ILLUSTRATION<br data-hf-id="hf-p50y">À PLANIFIER</span></div>
    <div data-hf-id="hf-p50z" class="standalone-face" data-layout-allow-occlusion="">MASTER CONTINU<br data-hf-id="hf-p510">FACE EN HAUT</div>
    
    <script>
      window.__timelines=window.__timelines||{};
      const p50broot=document.querySelector('#preuve-bas-50-root');
      const p50b=gsap.timeline({paused:true});
      const p50bmaster=document.querySelector('#meg-master-frame');
      if(p50bmaster){
        const p50bvideo=p50bmaster.querySelector('video,img');
        p50b.set(p50bmaster,{zIndex:2,x:46,y:46,width:988,height:903,borderRadius:34},0);
        p50b.set(p50bmaster,{clearProps:'zIndex,transform,width,height,borderRadius'},5);
        if(p50bvideo){
          p50b.set(p50bvideo,{objectPosition:'50% 32%'},0);
          p50b.set(p50bvideo,{clearProps:'objectPosition'},5);
        }
      }else{
        p50broot.querySelector('.standalone-face').style.display='flex';
      }
      p50b.fromTo(p50broot.querySelector('.proof'),{y:48,opacity:0},{y:0,opacity:1,duration:.42,ease:'power3.out'},0);
      window.__timelines['preuve-bas-50']=p50b;
    </script>
  </div>
</body>
</html>
