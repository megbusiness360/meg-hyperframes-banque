<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Liste cochée — les points se valident un à un.
     Trois affirmations maximum : chaque pastille se remplit d'or et sa coche se
     trace au rythme de la voix. Une liste qui apparaît d'un bloc est un slide ;
     une liste qui se coche est une démonstration. Remplacer le titre et les
     trois lignes ; supprimer une ligne si le discours n'en porte que deux. -->
<div data-hf-id="hf-lco0" id="liste-cochee-root" data-composition-id="liste-cochee" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #liste-cochee-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #liste-cochee-root .standalone-stage{display:none;position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:flex-end;justify-content:center;padding-bottom:220px;text-align:center;font-size:44px;font-weight:700;letter-spacing:-.02em}
      #liste-cochee-root .carte{position:absolute;z-index:2;left:96px;top:150px;width:888px;box-sizing:border-box;padding:40px 46px 48px;border-radius:44px;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%);color:#2F2C00;box-shadow:0 40px 88px rgba(0,0,0,.34);opacity:0}
      #liste-cochee-root .titre{font-size:56px;line-height:1;font-weight:700;letter-spacing:-.03em;word-spacing:.04em}
      #liste-cochee-root .ligne{margin-top:30px;display:flex;align-items:center;gap:22px;font-size:40px;font-weight:600;letter-spacing:-.015em;line-height:1.08}
      #liste-cochee-root .pastille{position:relative;width:58px;height:58px;flex:none;border-radius:50%;border:4px solid rgba(47,44,0,.30)}
      /* Le remplissage est un fond animé en scale : un border qui change de
         couleur ne se voit pas à ce rythme. */
      #liste-cochee-root .pastille .fond{position:absolute;inset:-4px;border-radius:50%;background:#B9AA02;transform:scale(0)}
      #liste-cochee-root .pastille svg{position:absolute;inset:0;margin:auto;width:34px;height:34px}
      #liste-cochee-root .pastille path{fill:none;stroke:#2F2C00;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:42;stroke-dashoffset:42}
    </style>
    <div data-hf-id="hf-lco1" class="standalone-stage" data-layout-allow-occlusion="">MASTER CONTINU<br data-hf-id="hf-lco2">DERRIÈRE LA CARTE</div>
    <div data-hf-id="hf-lco3" class="carte">
      <div data-hf-id="hf-lco4" class="titre">Ce que le dossier doit prouver</div>
      <div data-hf-id="hf-lco5" class="ligne"><span data-hf-id="hf-lco6" class="pastille"><span data-hf-id="hf-lco7" class="fond"></span><svg data-hf-id="hf-lco8" viewBox="0 0 34 34" aria-hidden="true"><path data-hf-id="hf-lco9" d="m6 18 8 8 14-16"/></svg></span><span data-hf-id="hf-lcoA">Un programme daté et signé</span></div>
      <div data-hf-id="hf-lcoB" class="ligne"><span data-hf-id="hf-lcoC" class="pastille"><span data-hf-id="hf-lcoD" class="fond"></span><svg data-hf-id="hf-lcoE" viewBox="0 0 34 34" aria-hidden="true"><path data-hf-id="hf-lcoF" d="m6 18 8 8 14-16"/></svg></span><span data-hf-id="hf-lcoG">Des émargements complets</span></div>
      <div data-hf-id="hf-lcoH" class="ligne"><span data-hf-id="hf-lcoI" class="pastille"><span data-hf-id="hf-lcoJ" class="fond"></span><svg data-hf-id="hf-lcoK" viewBox="0 0 34 34" aria-hidden="true"><path data-hf-id="hf-lcoL" d="m6 18 8 8 14-16"/></svg></span><span data-hf-id="hf-lcoM">Des évaluations tracées</span></div>
    </div>
    <script>
      window.__timelines=window.__timelines||{};
      const lcoRoot=document.querySelector('#liste-cochee-root');
      if(!document.querySelector('#meg-master-frame'))lcoRoot.querySelector('.standalone-stage').style.display='flex';
      const lco=gsap.timeline({paused:true});
      lco.fromTo(lcoRoot.querySelector('.carte'),{y:-92,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.1);
      lcoRoot.querySelectorAll('.ligne').forEach((ligne,i)=>{
        const depart=.7+i*.72;
        lco.to(ligne.querySelector('.fond'),{scale:1,duration:.3,ease:'back.out(1.8)'},depart)
           .to(ligne.querySelector('path'),{strokeDashoffset:0,duration:.3,ease:'power2.out'},depart+.16);
      });
      lco.to(lcoRoot.querySelector('.carte'),{y:-12,duration:1.8,ease:'none'},1.8);
      window.__timelines['liste-cochee']=lco;
    </script>
  </div>
</body>
</html>
