<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Bandeau identité — lower third.
     Qui parle, en deux lignes calibrées au texte (jamais de bandeau pleine
     largeur). Posé bas-gauche AU-DESSUS de l'ancre des sous-titres : les deux
     cohabitent sans se toucher. Entre par la gauche, vit 4 secondes, ressort —
     un bandeau qui reste tout le long devient du décor. Régler data-nom et
     data-role sur le groupe. -->
<div data-hf-id="hf-bid0" id="bandeau-identite-root" data-composition-id="bandeau-identite" data-start="0" data-duration="4" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #bandeau-identite-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #bandeau-identite-root .groupe{position:absolute;z-index:10;left:46px;bottom:250px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
      /* Deux gélules décalées, pas un cartouche : la ligne du nom domine, le
         rôle suit en retrait — même logique d'escalier que le Titre TikTok. */
      #bandeau-identite-root .nom{display:inline-flex;align-items:center;gap:16px;padding:16px 30px;border-radius:26px;background:#FFFCD6;color:#2F2C00;font-size:46px;font-weight:700;letter-spacing:-.025em;box-shadow:0 14px 34px rgba(47,44,0,.28)}
      #bandeau-identite-root .pastille{width:20px;height:20px;flex:none;border-radius:50%;background:#B9AA02}
      #bandeau-identite-root .role{display:inline-block;margin-left:24px;padding:12px 24px;border-radius:20px;background:rgba(47,44,0,.86);color:#FFFCD6;font-size:30px;font-weight:600;letter-spacing:.01em}
    </style>
    <div data-hf-id="hf-bid1" class="groupe" data-nom="Mohamed — MEG Business 360" data-role="Conseil OF, CFA & financements">
      <span data-hf-id="hf-bid2" class="nom"><span data-hf-id="hf-bid3" class="pastille"></span><span data-hf-id="hf-bid4" class="nom-texte">Mohamed — MEG Business 360</span></span>
      <span data-hf-id="hf-bid5" class="role">Conseil OF, CFA &amp; financements</span>
    </div>
    <script>
      window.__timelines=window.__timelines||{};
      const bidGroupe=document.querySelector('#bandeau-identite-root .groupe');
      bidGroupe.querySelector('.nom-texte').textContent=bidGroupe.getAttribute('data-nom')||'';
      bidGroupe.querySelector('.role').textContent=bidGroupe.getAttribute('data-role')||'';
      const bid=gsap.timeline({paused:true});
      bid.fromTo(bidGroupe.querySelector('.nom'),{x:-560,opacity:0},{x:0,opacity:1,duration:.46,ease:'power3.out'},.1)
         .fromTo(bidGroupe.querySelector('.role'),{x:-560,opacity:0},{x:0,opacity:1,duration:.46,ease:'power3.out'},.22)
         /* Sortie avant la fin du bloc : le bandeau ne meurt jamais sur une coupe. */
         .to(bidGroupe.querySelectorAll('.nom,.role'),{x:-560,opacity:0,duration:.36,ease:'power3.in',stagger:.08},3.3);
      window.__timelines['bandeau-identite']=bid;
    </script>
  </div>
</body>
</html>
