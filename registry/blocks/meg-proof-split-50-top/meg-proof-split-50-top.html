<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Partage à parts égales : preuve en haut, visage en bas. Même gouttière et
     même rayon que les splits 40/60 ; seules les hauteurs changent.
     1920 - 46 (haut) - 46 (bas) - 22 (gouttière) = 1806, soit 903 par moitié. -->
<div data-hf-id="hf-p50t" id="preuve-haut-50-root" data-composition-id="preuve-haut-50" data-start="0" data-duration="5" data-start="0" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('../assets/ClashGrotesk-Variable.woff2') format('woff2')}
      #preuve-haut-50-root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #preuve-haut-50-root .proof{position:absolute;left:46px;top:46px;width:988px;height:903px;box-sizing:border-box;overflow:hidden;border:7px solid #fffcd6;border-radius:34px;background:#fffcd6;box-shadow:0 20px 60px rgba(0,0,0,.16);opacity:0}
      #preuve-haut-50-root .placeholder{display:flex;align-items:center;justify-content:center;padding:54px;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);color:#2f2c00;text-align:center;font-size:43px;line-height:1.02;font-weight:600;letter-spacing:-.035em}
      #preuve-haut-50-root .standalone-face{display:none;position:absolute;left:46px;top:971px;width:988px;height:903px;border-radius:34px;background:#2f2c00;color:#fffcd6;align-items:center;justify-content:center;text-align:center;font-size:52px;font-weight:700;letter-spacing:-.03em}
    </style>
    <div data-hf-id="hf-p50a" class="proof placeholder"><span data-hf-id="hf-p50b">ILLUSTRATION<br data-hf-id="hf-p50c">À PLANIFIER</span></div>
    <div data-hf-id="hf-p50d" class="standalone-face" data-layout-allow-occlusion="">MASTER CONTINU<br data-hf-id="hf-p50e">FACE EN BAS</div>
    
    <script>
      window.__timelines=window.__timelines||{};
      const p50troot=document.querySelector('#preuve-haut-50-root');
      const p50t=gsap.timeline({paused:true});
      if(!document.querySelector('#meg-master-frame')){
        p50troot.querySelector('.standalone-face').style.display='flex';
        p50t.set(p50troot.querySelector('.proof'),{y:-48,opacity:0}).to(p50troot.querySelector('.proof'),{y:0,opacity:1,duration:.42,ease:'power3.out'},0);
      }
      window.__timelines['preuve-haut-50']=p50t;
    </script>
  </div>
</body>
</html>
