<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Habillage Reel — cadre crème épais. Le master reste plein cadre, l'habillage
     se pose dessus (piste 2) et s'étire sur la durée voulue. -->
<div data-hf-id="hf-1ymf0" id="reel-habillage-cadre-creme-epais-root" data-composition-id="reel-habillage-cadre-creme-epais" data-start="0" data-duration="6" data-width="1080" data-height="1920">
    <style>
      #reel-habillage-cadre-creme-epais-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
      #reel-habillage-cadre-creme-epais-root .cadre{position:absolute;z-index:3;inset:0;border:26px solid #FFFCD6;border-radius:8px;pointer-events:none;opacity:0}
    </style>
    <div data-hf-id="hf-1ymf1" class="cadre"></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-habillage-cadre-creme-epais-root');
      const tl=gsap.timeline({paused:true});

      tl.fromTo(root.querySelector('.cadre'),{opacity:0},{opacity:1,duration:.5,ease:'power2.out'},.05);
      window.__timelines['reel-habillage-cadre-creme-epais']=tl;
      })();
    </script>
  </div>
</body>
</html>
