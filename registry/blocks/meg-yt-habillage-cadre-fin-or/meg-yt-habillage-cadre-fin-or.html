<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Habillage YouTube — cadre fin or. Master plein cadre intact, l'habillage
     se pose dessus et s'étire sur la durée voulue. -->
<div data-hf-id="hf-11qr0" id="yt-habillage-cadre-fin-or-root" data-composition-id="yt-habillage-cadre-fin-or" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <style>
      #yt-habillage-cadre-fin-or-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
      #yt-habillage-cadre-fin-or-root .cadre{position:absolute;z-index:3;inset:34px;border:4px solid #B9AA02;border-radius:26px;pointer-events:none;opacity:0}
    </style>
    <div data-hf-id="hf-11qr1" class="cadre"></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#yt-habillage-cadre-fin-or-root');
      const tl=gsap.timeline({paused:true});

      tl.fromTo(root.querySelector('.cadre'),{opacity:0,scale:1.03},{opacity:1,scale:1,duration:.5,ease:'power2.out'},.05);
      window.__timelines['yt-habillage-cadre-fin-or']=tl;
      })();
    </script>
  </div>
</body>
</html>
