<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Carton de chapitre Reel — barre basse + libellé. Le master reste plein cadre,
     l'habillage passe dessus puis s'efface. Remplacer numéro et libellé. -->
<div data-hf-id="hf-e1yq0" id="reel-chapitre-barre-basse-root" data-composition-id="reel-chapitre-barre-basse" data-start="0" data-duration="4" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-chapitre-barre-basse-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-chapitre-barre-basse-root .barre-chap{position:absolute;z-index:3;left:46px;bottom:150px;right:46px;height:96px;border-radius:26px;background:rgba(47,44,0,.82);display:flex;align-items:center;gap:24px;padding:0 34px;color:#FFFCD6;opacity:0}
#reel-chapitre-barre-basse-root .barre-chap .num-or{font-size:44px;font-weight:700;color:#B9AA02}
#reel-chapitre-barre-basse-root .barre-chap .lib{font-size:38px;font-weight:600;letter-spacing:-.01em}
#reel-chapitre-barre-basse-root .jauge{position:absolute;left:0;bottom:0;height:7px;border-radius:4px;background:#B9AA02;width:100%;transform-origin:left}
    </style>
    <div data-hf-id="hf-e1yq1" class="barre-chap" data-layout-allow-occlusion=""><span data-hf-id="hf-e1yq2" class="num-or">02</span><span data-hf-id="hf-e1yq3" class="lib">Titre du chapitre à remplacer</span><span data-hf-id="hf-e1yq4" class="jauge"></span></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-chapitre-barre-basse-root');
      const tl=gsap.timeline({paused:true});

      tl.fromTo(root.querySelector('.barre-chap'),{y:40,opacity:0},{y:0,opacity:1,duration:.45,ease:'power3.out'},.08)
        .fromTo(root.querySelector('.jauge'),{scaleX:0},{scaleX:.5,duration:1.6,ease:'power1.inOut'},.5)
        .to(root.querySelector('.barre-chap'),{opacity:0,y:30,duration:.35,ease:'power2.in'},3.55);
      window.__timelines['reel-chapitre-barre-basse']=tl;
      })();
    </script>
  </div>
</body>
</html>
