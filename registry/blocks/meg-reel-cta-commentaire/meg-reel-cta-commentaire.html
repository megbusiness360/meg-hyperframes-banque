<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- CTA/outro Reel — appel au commentaire. Remplacer les textes ; l'appel à l'action
     reste indirect (règles MEG : on montre où continuer, on ne supplie pas). -->
<div data-hf-id="hf-62gm0" id="reel-cta-commentaire-root" data-composition-id="reel-cta-commentaire" data-start="0" data-duration="4" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-cta-commentaire-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-cta-commentaire-root .bulle{position:absolute;z-index:3;left:90px;bottom:260px;right:90px;border-radius:44px;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%);box-shadow:0 34px 78px rgba(0,0,0,.35);padding:46px 54px;color:#2F2C00;opacity:0}
#reel-cta-commentaire-root .bulle .q{font-size:52px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
#reel-cta-commentaire-root .bulle .trait{margin-top:22px;width:210px;height:8px;border-radius:4px;background:#B9AA02;transform-origin:left}
    </style>
    <div data-hf-id="hf-62gm1" class="bulle" data-layout-allow-occlusion=""><div data-hf-id="hf-62gm2" class="q">Votre cas est différent ?<br data-hf-id="hf-62gm3">Dites-le en commentaire.</div><div data-hf-id="hf-62gm4" class="trait"></div></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-cta-commentaire-root');
      const tl=gsap.timeline({paused:true});

      tl.fromTo(root.querySelector('.bulle'),{y:60,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.1)
        .fromTo(root.querySelector('.trait'),{scaleX:0},{scaleX:1,duration:.5,ease:'power2.out'},.5)
        .to(root.querySelector('.bulle'),{opacity:0,y:40,duration:.35,ease:'power2.in'},3.55);
      window.__timelines['reel-cta-commentaire']=tl;
      })();
    </script>
  </div>
</body>
</html>
