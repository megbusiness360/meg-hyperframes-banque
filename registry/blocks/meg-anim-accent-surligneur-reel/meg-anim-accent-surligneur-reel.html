<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Accent surligneur — un trait or translucide balaie la ligne, geste
     feutre. Déplacer .accent-surligne sur le texte à marquer.
     transform-origin CSS seul (pas de transform CSS : scaleX posé par GSAP). -->
<div data-hf-id="hf-806z0" id="anim-accent-surligneur-reel-root" data-composition-id="anim-accent-surligneur-reel" data-start="0" data-duration="3" data-width="1080" data-height="1920">
    <style>
      #anim-accent-surligneur-reel-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
      #anim-accent-surligneur-reel-root .accent-surligne{position:absolute;z-index:30;left:150px;top:1150px;width:780px;height:72px;border-radius:14px;background:rgba(185,170,2,.42);transform-origin:left center;pointer-events:none}
    </style>
    <div data-hf-id="hf-806z1" class="accent-surligne" data-layout-allow-occlusion=""></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#anim-accent-surligneur-reel-root');
      const tl=gsap.timeline({paused:true});
      
      tl.fromTo(root.querySelector('.accent-surligne'),{scaleX:0},{scaleX:1,duration:.55,ease:'power2.inOut'},.15)
        .to(root.querySelector('.accent-surligne'),{opacity:0,duration:.3,ease:'power2.in'},2.6);
      window.__timelines['anim-accent-surligneur-reel']=tl;
      })();
    </script>
  </div>
</body>
</html>
