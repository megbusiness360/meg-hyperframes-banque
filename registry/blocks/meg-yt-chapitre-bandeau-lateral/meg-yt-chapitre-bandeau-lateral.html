<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Carton de chapitre YouTube — bandeau latéral. Master plein cadre intact,
     habillage par-dessus. Remplacer numéro et libellé. -->
<div data-hf-id="hf-evlf0" id="yt-chapitre-bandeau-lateral-root" data-composition-id="yt-chapitre-bandeau-lateral" data-start="0" data-duration="4" data-width="1920" data-height="1080">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #yt-chapitre-bandeau-lateral-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #yt-chapitre-bandeau-lateral-root .bandeau{position:absolute;z-index:3;left:0;top:0;width:120px;height:100%;background:#2F2C00;display:flex;align-items:center;justify-content:center;opacity:0}
#yt-chapitre-bandeau-lateral-root .vertical{white-space:nowrap;color:#FFFCD6;font-size:44px;font-weight:700;letter-spacing:.14em}
#yt-chapitre-bandeau-lateral-root .filet-or{position:absolute;z-index:4;left:120px;top:0;width:7px;height:100%;background:#B9AA02;opacity:0}
    </style>
    <div data-hf-id="hf-evlf1" class="bandeau" data-layout-allow-occlusion=""><span data-hf-id="hf-evlf2" class="vertical">CHAPITRE 2 — LE DOSSIER</span></div><div data-hf-id="hf-evlf3" class="filet-or"></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#yt-chapitre-bandeau-lateral-root');
      const tl=gsap.timeline({paused:true});
      
      gsap.set(root.querySelector('.vertical'),{rotation:-90});
      tl.fromTo(root.querySelector('.bandeau'),{x:-130,opacity:0},{x:0,opacity:1,duration:.45,ease:'power3.out'},.05)
        .fromTo(root.querySelector('.filet-or'),{opacity:0},{opacity:1,duration:.3},.4)
        .to([root.querySelector('.bandeau'),root.querySelector('.filet-or')],{x:-140,opacity:0,duration:.4,ease:'power2.in'},3.5);
      window.__timelines['yt-chapitre-bandeau-lateral']=tl;
      })();
    </script>
  </div>
</body>
</html>
