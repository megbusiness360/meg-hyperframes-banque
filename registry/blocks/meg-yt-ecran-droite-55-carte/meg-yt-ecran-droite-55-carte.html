<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Layout YouTube 16:9 — écran droite 55 % (carte crème).
     Le split roi des vidéos longues : démo/capture d'un côté, présentateur
     de l'autre. Poser le bloc suffit (master piloté), remplacer la zone
     hachurée par la capture. -->
<div data-hf-id="hf-1dh00" id="yt-ecran-droite-55-carte-root" data-composition-id="yt-ecran-droite-55-carte" data-start="0" data-duration="6" data-width="1920" data-height="1080" data-face-x="40" data-face-y="40" data-face-w="813" data-face-h="1000" data-face-r="30" data-face-mode="move">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #yt-ecran-droite-55-carte-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #yt-ecran-droite-55-carte-root .ecran{position:absolute;z-index:3;box-sizing:border-box;border:7px solid #fffcd6;border-radius:34px;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);box-shadow:0 34px 78px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#2F2C00;overflow:hidden;opacity:0}
#yt-ecran-droite-55-carte-root .ecran.bord{border:0;border-radius:0;box-shadow:none}
#yt-ecran-droite-55-carte-root .ecran .etiquette{padding:12px 26px;border-radius:22px;background:#2F2C00;color:#FFFCD6;font-size:40px;font-weight:700;letter-spacing:.05em}
#yt-ecran-droite-55-carte-root .ecran .sous{font-size:29px;font-weight:600;opacity:.62;letter-spacing:-.01em}
#yt-ecran-droite-55-carte-root .ecran .barre{position:absolute;left:0;top:0;right:0;display:flex;align-items:center;gap:14px;height:88px;padding:0 26px;background:#FFFCD6;border-bottom:2px solid rgba(47,44,0,.10)}
#yt-ecran-droite-55-carte-root .ecran .pastille{width:16px;height:16px;border-radius:50%;background:rgba(47,44,0,.18)}
#yt-ecran-droite-55-carte-root .ecran .url{flex:1;margin-left:8px;padding:11px 24px;border-radius:999px;background:#FFFEEC;color:#2F2C00;font-size:28px;font-weight:600;white-space:nowrap;overflow:hidden}
#yt-ecran-droite-55-carte-root .face-cadre{position:absolute;z-index:5;border:7px solid #fffcd6;border-radius:30px;pointer-events:none;opacity:0}
#yt-ecran-droite-55-carte-root .standalone-face{display:none;position:absolute;z-index:2;left:40px;top:40px;width:813px;height:1000px;border-radius:30px;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
    </style>
    <div data-hf-id="hf-1dh01" class="ecran" style="left:875px;top:40px;width:1005px;height:1000px;" data-layout-allow-occlusion=""><span data-hf-id="hf-1dh02" class="etiquette">ÉCRAN — REMPLACER</span><span data-hf-id="hf-1dh03" class="sous">capture, démo, document</span></div>
    <div data-hf-id="hf-1dh04" class="face-cadre" style="left:33px;top:33px;width:827px;height:1014px;"></div>
    <div data-hf-id="hf-1dh05" class="standalone-face" data-layout-allow-occlusion="">MASTER CONTINU<br data-hf-id="hf-1dh06">RECADRÉ ICI</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#yt-ecran-droite-55-carte-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Drag & drop pur : le bloc recadre le master lui-même. Entrée depuis
           le plein cadre, sortie qui LE RESTAURE — le bloc suivant repart
           toujours d'un master plein cadre. */
        tl.fromTo(master,{x:0,y:0,width:1920,height:1080,borderRadius:0},
          {x:40,y:40,width:813,height:1000,borderRadius:30,duration:.42,ease:'power3.out'},0)
          .to(master,{x:0,y:0,width:1920,height:1080,borderRadius:0,duration:.42,ease:'power3.in'},5.58);
      }else{
        const sa=root.querySelector('.standalone-face');
        if(sa){sa.style.display='flex';tl.fromTo(sa,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'},0);}
      }
      tl.fromTo(root.querySelectorAll('.ecran'),{x:70,opacity:0,scale:.97},{x:0,opacity:1,scale:1,duration:.5,ease:'power3.out',stagger:.12},.06)
        .to(root.querySelectorAll('.ecran'),{opacity:0,x:44,duration:.35,ease:'power2.in'},5.60);
      const cadre=root.querySelector('.face-cadre');
      if(cadre)tl.fromTo(cadre,{opacity:0},{opacity:1,duration:.4,ease:'power2.out'},.2)
        .to(cadre,{opacity:0,duration:.3,ease:'power2.in'},5.62);
      window.__timelines['yt-ecran-droite-55-carte']=tl;
      })();
    </script>
  </div>
</body>
</html>
