<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Habillage YouTube — vignette de focus. Master plein cadre intact, l'habillage
     se pose dessus et s'étire sur la durée voulue. -->
<div data-hf-id="hf-1ss80" id="yt-habillage-vignette-focus-root" data-composition-id="yt-habillage-vignette-focus" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <style>
      #yt-habillage-vignette-focus-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
      #yt-habillage-vignette-focus-root .vignette{position:absolute;z-index:3;inset:0;background:radial-gradient(64% 70% at 50% 46%,rgba(0,0,0,0) 58%,rgba(31,29,0,.52) 100%);pointer-events:none;opacity:0}
    </style>
    <div data-hf-id="hf-1ss81" class="vignette" data-layout-allow-occlusion=""></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#yt-habillage-vignette-focus-root');
      const tl=gsap.timeline({paused:true});
      
      tl.fromTo(root.querySelector('.vignette'),{opacity:0},{opacity:1,duration:.8,ease:'power2.out'},.05);
      window.__timelines['yt-habillage-vignette-focus']=tl;
      })();
    </script>
  </div>
</body>
</html>
