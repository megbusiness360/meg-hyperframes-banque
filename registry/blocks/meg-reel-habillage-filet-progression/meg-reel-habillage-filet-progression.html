<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Habillage Reel — filet de progression bas. Le master reste plein cadre, l'habillage
     se pose dessus (piste 2) et s'étire sur la durée voulue. -->
<div data-hf-id="hf-11ok0" id="reel-habillage-filet-progression-root" data-composition-id="reel-habillage-filet-progression" data-start="0" data-duration="6" data-width="1080" data-height="1920">
    <style>
      #reel-habillage-filet-progression-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
      #reel-habillage-filet-progression-root .rail-prog{position:absolute;z-index:3;left:0;bottom:0;width:100%;height:12px;background:rgba(255,252,214,.28)}
#reel-habillage-filet-progression-root .rail-prog .avance{position:absolute;left:0;top:0;height:100%;width:100%;background:#B9AA02;transform-origin:left}
    </style>
    <div data-hf-id="hf-11ok1" class="rail-prog"><span data-hf-id="hf-11ok2" class="avance"></span></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-habillage-filet-progression-root');
      const tl=gsap.timeline({paused:true});
      
      tl.fromTo(root.querySelector('.avance'),{scaleX:0},{scaleX:1,duration:6,ease:'none'},0);
      window.__timelines['reel-habillage-filet-progression']=tl;
      })();
    </script>
  </div>
</body>
</html>
