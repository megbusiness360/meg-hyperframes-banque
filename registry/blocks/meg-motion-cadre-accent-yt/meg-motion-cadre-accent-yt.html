<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Cadre accent — souligner le moment fort sans rien masquer. Se pose
     tel quel, aucune édition nécessaire. -->
<div data-hf-id="hf-2gdc0" id="motion-cadre-accent-yt-root" data-composition-id="motion-cadre-accent-yt" data-start="0" data-duration="2.5" data-width="1920" data-height="1080">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #motion-cadre-accent-yt-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #motion-cadre-accent-yt-root .cadre-a{position:absolute;z-index:6;inset:28px;box-sizing:border-box;border:14px solid #B9AA02;border-radius:44px;box-shadow:0 0 60px rgba(185,170,2,.4),inset 0 0 60px rgba(185,170,2,.25);opacity:0}
    </style>
    <div data-hf-id="hf-2gdc1" class="cadre-a" data-layout-allow-occlusion=""></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#motion-cadre-accent-yt-root');
      const tl=gsap.timeline({paused:true});

      const c=root.querySelector('.cadre-a');
      tl.fromTo(c,{scale:1.05,opacity:0},{scale:1,opacity:1,duration:.4,ease:'power3.out'},.05)
        .fromTo(c,{opacity:1},{opacity:.75,duration:.45,ease:'sine.inOut',yoyo:true,repeat:2},.55)
        .to(c,{scale:1.04,opacity:0,duration:.35,ease:'power2.in'},2.1);
      window.__timelines['motion-cadre-accent-yt']=tl;
      })();
    </script>
  </div>
</body>
</html>
