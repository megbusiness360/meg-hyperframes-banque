<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@700,600&f[]=cabinet-grotesk@400,700,800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>@font-face{font-family:'Clash Grotesk';src:url('https://cdn.fontshare.com/wf/MKEEQN57GWBZOSYWCRODNJOOZNPLMAKN/5SPTSZGHEACWWLF34DQ4WAA4OGU6PQIF/KN7DX4F6PXB74R6L2K2Y4NH3CB7FC53Q.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}@font-face{font-family:'Clash Grotesk';src:url('https://cdn.fontshare.com/wf/P6VJ47S3OYMUC7HYSJLTK7PEIK5O2NPQ/TK62VLUWA76PMTK2XWBNDZB7QVXJGYE3/I5W5NEJGYVFUC5I4XOXVET63OE5PSVHJ.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:'Cabinet Grotesk';src:url('https://cdn.fontshare.com/wf/J6PPRPKWXDUIYA47IXLEQB4R4OPVYDQH/N2ZXAXWEHVMLISD2TIXJC7EF4GOY43L4/NXM4Z4TDCMYWBZ7AVI2N6DQ5VMWNENMU.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:'Cabinet Grotesk';src:url('https://cdn.fontshare.com/wf/XMXWOHABYLQDJ42L65EFRYNVRY37HQCB/B2O4O6V3JMFM2WDCYQI3A47L5U4THDUL/WN5274VQ3AUBDFP74GB4EC4XYJ3EKVNE.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:'Cabinet Grotesk';src:url('https://cdn.fontshare.com/wf/ZX6AQLSFYVDPN2URWO2MQFGTYYOHIS64/TPYPKOYWFQVNJHLLRXD4KFYX4LUOUW4Z/6QH2ALVTTK7IRVO5MYOQQ3OZNXW5SSS3.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Notification messagerie — une preuve courte qui arrive par le haut,
     reste lisible, puis sort avant de rendre le master à la main. Le texte
     est une variable de montage dans le script. -->
<div data-hf-id="hf-nmr0" id="notification-message-reel-root" data-composition-id="notification-message-reel" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
  <style>
    #notification-message-reel-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Cabinet Grotesk',sans-serif}
    #notification-message-reel-root .substitut{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);display:none}
    #notification-message-reel-root .carte-message{position:absolute;z-index:20;left:72px;top:64px;width:936px;min-height:248px;padding:28px 32px;display:grid;grid-template-columns:84px 1fr;column-gap:24px;align-items:start;border-radius:28px;background:#3B3B3B;color:#FFFEEC;box-shadow:0 18px 44px rgba(47,44,0,.38);opacity:0}
    #notification-message-reel-root .avatar{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#B9AA02;color:#2F2C00;font-family:'Clash Grotesk',sans-serif;font-size:28px;font-weight:700}
    #notification-message-reel-root .meta{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-top:2px}
    #notification-message-reel-root .nom{font-family:'Clash Grotesk',sans-serif;font-size:32px;font-weight:600;line-height:1.05}
    #notification-message-reel-root .heure{font-size:24px;color:#FFFCD6;opacity:.72;white-space:nowrap}
    #notification-message-reel-root .app{margin-top:8px;font-size:22px;font-weight:700;letter-spacing:.04em;color:#FFFCD6;opacity:.82}
    #notification-message-reel-root .message{grid-column:2;margin-top:20px;max-width:740px;font-size:30px;font-weight:400;line-height:1.18;color:#FFFEEC}
  </style>
  <div data-hf-id="hf-nmr1" class="substitut" data-layout-allow-occlusion=""></div>
  <div data-hf-id="hf-nmr2" class="carte-message" data-layout-allow-occlusion="">
    <div data-hf-id="hf-nmr3" class="avatar" aria-hidden="true">OF</div>
    <div data-hf-id="hf-nmr4" class="contenu">
      <div data-hf-id="hf-nmr5" class="meta"><span data-hf-id="hf-nmr6" class="nom">Client OF</span><span data-hf-id="hf-nmr7" class="heure">14:32</span></div>
      <div data-hf-id="hf-nmr8" class="app">WhatsApp</div>
    </div>
    <div data-hf-id="hf-nmr9" class="message"></div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    (()=>{
      const MESSAGE='Dossier accepté, merci Mohamed 🙏';
      const root=document.querySelector('#notification-message-reel-root');
      const card=root.querySelector('.carte-message');
      root.querySelector('.message').textContent=MESSAGE;
      const tl=gsap.timeline({paused:true});
      tl.fromTo(card,{y:-330,opacity:0},{y:0,opacity:1,duration:.5,ease:'back.out(1.35)'},0)
        .fromTo(card,{y:0,opacity:1},{y:-330,opacity:0,duration:.5,ease:'power2.in'},3);
      window.__timelines['notification-message-reel']=tl;
    })();
  </script>
</div>
</body>
</html>
