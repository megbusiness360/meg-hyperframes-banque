<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Intro YouTube — chiffre choc. Visage en bande basse, textes à remplacer,
     animations incluses. Enchaîner sur un split une fois le hook posé. -->
<div data-hf-id="hf-b0e60" id="yt-intro-hook-chiffre-root" data-composition-id="yt-intro-hook-chiffre" data-start="0" data-duration="5" data-width="1920" data-height="1080" data-face-x="0" data-face-y="750" data-face-w="1920" data-face-h="330" data-face-r="0" data-face-mode="move">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #yt-intro-hook-chiffre-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #yt-intro-hook-chiffre-root .fond-scene{position:absolute;inset:0;z-index:1;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%)}
      #yt-intro-hook-chiffre-root .scene{position:absolute;z-index:3;left:0;top:0;width:1920px;height:750px;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:60px 160px;color:#2F2C00;text-align:center}
#yt-intro-hook-chiffre-root .couture{position:absolute;z-index:4;left:0;top:744px;width:100%;height:6px;background:#B9AA02;box-shadow:0 0 34px rgba(185,170,2,.55)}
#yt-intro-hook-chiffre-root .titre-geant{font-size:104px;line-height:.96;font-weight:700;letter-spacing:-.03em;word-spacing:.05em}
#yt-intro-hook-chiffre-root .sous-titre{font-size:38px;font-weight:600;opacity:.62}
#yt-intro-hook-chiffre-root .gelule{display:inline-block;padding:14px 32px;border-radius:999px;background:#2F2C00;color:#FFFCD6;font-size:30px;font-weight:700;letter-spacing:.06em}
#yt-intro-hook-chiffre-root .standalone-face{display:none;position:absolute;z-index:2;left:0px;top:750px;width:1920px;height:330px;border-radius:0px;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
    </style>
    <div data-hf-id="hf-b0e61" class="fond-scene" data-layout-allow-occlusion=""></div>
    <div data-hf-id="hf-b0e62" class="scene" data-layout-allow-occlusion="" style="flex-direction:row;gap:70px;"><div data-hf-id="hf-b0e63" class="titre-geant" style="font-size:250px;color:#B9AA02;-webkit-text-stroke:3px #2F2C00;">87 %</div><div data-hf-id="hf-b0e64" class="sous-titre" style="font-size:52px;opacity:1;font-weight:700;text-align:left;">des dossiers sont refusés<br data-hf-id="hf-b0e65">pour cette raison</div></div>
    <div data-hf-id="hf-b0e66" class="couture"></div>
    <div data-hf-id="hf-b0e67" class="standalone-face" data-layout-allow-occlusion="">MASTER — BANDE VISAGE</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#yt-intro-hook-chiffre-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Drag & drop pur : le bloc recadre le master lui-même. Entrée depuis
           le plein cadre, sortie qui LE RESTAURE — le bloc suivant repart
           toujours d'un master plein cadre. z-index 2 pendant le bloc : le
           master passe AU-DESSUS du fond de scène crème (z1) et SOUS les
           cartes du bloc (z3+). */
        tl.set(master,{zIndex:2},0)
          .fromTo(master,{x:0,y:0,width:1920,height:1080,borderRadius:0},
          {x:0,y:750,width:1920,height:330,borderRadius:0,duration:.42,ease:'power3.out'},0)
          .to(master,{x:0,y:0,width:1920,height:1080,borderRadius:0,duration:.42,ease:'power3.in'},4.58)
          .set(master,{clearProps:'zIndex'},5.00);
        /* Biais visage : pendant le recadrage, la fenêtre cover vise le haut
           du rush (le visage), pas le centre géométrique. Valeur d'origine
           restaurée en sortie — le bloc suivant repart d'un master intact. */
        const vid=master.querySelector('video,img');
        if(vid){
          const op0=vid.style.objectPosition||getComputedStyle(vid).objectPosition||'50% 50%';
          tl.set(vid,{objectPosition:'50% 6%'},0).set(vid,{objectPosition:op0},5.00);
        }
      }else{
        const sa=root.querySelector('.standalone-face');
        if(sa){sa.style.display='flex';tl.fromTo(sa,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'},0);}
      }
      tl.fromTo(root.querySelector('.titre-geant'),{scale:.7,opacity:0},{scale:1,opacity:1,duration:.5,ease:'back.out(1.6)'},.08)
        .fromTo(root.querySelector('.sous-titre'),{x:50,opacity:0},{x:0,opacity:1,duration:.45,ease:'power3.out'},.4);
      tl.to(root.querySelector('.scene'),{opacity:0,duration:.35,ease:'power2.in'},4.6);
      window.__timelines['yt-intro-hook-chiffre']=tl;
      })();
    </script>
  </div>
</body>
</html>
