<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Habillage Reel — vignette de focus. Le master reste plein cadre, l'habillage
     se pose dessus (piste 2) et s'étire sur la durée voulue. -->
<div data-hf-id="hf-1e2l0" id="reel-habillage-vignette-focus-root" data-composition-id="reel-habillage-vignette-focus" data-start="0" data-duration="6" data-width="1080" data-height="1920">
    <style>
      #reel-habillage-vignette-focus-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
      #reel-habillage-vignette-focus-root .vignette{position:absolute;z-index:3;inset:0;background:radial-gradient(72% 62% at 50% 44%,rgba(0,0,0,0) 58%,rgba(31,29,0,.52) 100%);pointer-events:none;opacity:0}
    </style>
    <div data-hf-id="hf-1e2l1" class="vignette" data-layout-allow-occlusion=""></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-habillage-vignette-focus-root');
      const tl=gsap.timeline({paused:true});

      tl.fromTo(root.querySelector('.vignette'),{opacity:0},{opacity:1,duration:.8,ease:'power2.out'},.05);
      window.__timelines['reel-habillage-vignette-focus']=tl;
      })();
    </script>
  </div>
</body>
</html>
