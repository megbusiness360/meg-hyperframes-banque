<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Habillage YouTube — bandes cinéma. Master plein cadre intact, l'habillage
     se pose dessus et s'étire sur la durée voulue. -->
<div data-hf-id="hf-kosm0" id="yt-habillage-bandes-cinema-root" data-composition-id="yt-habillage-bandes-cinema" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <style>
      #yt-habillage-bandes-cinema-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
      #yt-habillage-bandes-cinema-root .bande{position:absolute;z-index:3;left:0;width:100%;height:0;background:#1F1D00}
#yt-habillage-bandes-cinema-root .bande.h{top:0}#yt-habillage-bandes-cinema-root .bande.b{bottom:0}
    </style>
    <div data-hf-id="hf-kosm1" class="bande h" data-layout-allow-occlusion=""></div><div data-hf-id="hf-kosm2" class="bande b" data-layout-allow-occlusion=""></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#yt-habillage-bandes-cinema-root');
      const tl=gsap.timeline({paused:true});
      
      tl.to(root.querySelectorAll('.bande'),{height:120,duration:.7,ease:'power3.inOut'},.05);
      window.__timelines['yt-habillage-bandes-cinema']=tl;
      })();
    </script>
  </div>
</body>
</html>
