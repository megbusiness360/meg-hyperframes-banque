<!-- Preuve plein écran — capture centrée.
     Le fond n'est plus un aplat jaune : dégradé crème + halo or discret, pour que
     la capture se détache et paraisse posée sur une surface, pas collée dessus.
     La capture est une page entière (assets/meg-site-long.png, ~7000 px de haut) et
     elle DÉFILE pendant le plan : une preuve qui bouge se lit, une preuve figée se
     regarde. Régénérer les captures avec tools/snap-site.mjs.
     Remplacer l'image, le sur-titre et le nom de domaine. -->
<template id="preuve-plein-ecran-template">
  <div data-hf-id="hf-finn" id="preuve-plein-ecran-root" data-composition-id="preuve-plein-ecran" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #preuve-plein-ecran-root{position:relative;width:100%;height:100%;overflow:hidden;box-sizing:border-box;padding:104px 62px 88px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(168deg,#FFFEEC 0%,#FFFCD6 44%,#F6EDB2 100%);color:#2F2C00;font-family:'Clash Grotesk MEG',sans-serif}
      /* Halo or : donne du volume au fond sans ajouter d'aplat de couleur. */
      #preuve-plein-ecran-root .halo{position:absolute;left:50%;top:-160px;width:1280px;height:900px;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(185,170,2,.26) 0%,rgba(185,170,2,0) 72%);pointer-events:none}
      /* Sur-titre : plus une gélule or pleine, mais une puce crème à filet or avec
         son picto tracé. Même place, lecture plus posée, moins « badge générique ». */
      #preuve-plein-ecran-root .eyebrow{position:relative;display:inline-flex;align-items:center;gap:14px;padding:13px 28px 13px 22px;border-radius:999px;background:#FFFEEC;border:2px solid rgba(185,170,2,.55);box-shadow:0 10px 26px rgba(47,44,0,.10);font-size:29px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:0}
      #preuve-plein-ecran-root .eyebrow svg{width:34px;height:34px;flex:none;fill:none;stroke:#B9AA02;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      /* Tracking serré mais mots séparés : à -0,04 em les mots se collent. */
      #preuve-plein-ecran-root .titre{position:relative;margin-top:26px;text-align:center;font-size:78px;line-height:.94;font-weight:700;letter-spacing:-.028em;word-spacing:.05em;opacity:0}
      /* La carte flotte : ombre longue et très diffuse, jamais de contour dur. */
      #preuve-plein-ecran-root .carte{position:relative;margin-top:44px;width:956px;height:1210px;padding:18px;box-sizing:border-box;border-radius:44px;background:#FFFEEC;box-shadow:0 44px 96px rgba(47,44,0,.24),0 6px 18px rgba(47,44,0,.10);opacity:0}
      /* Hublot : la page est plus haute que le cadre, seul son haut est visible et
         c'est lui qui glisse. Sans overflow:hidden, la page déborde de la carte. */
      #preuve-plein-ecran-root .hublot{width:100%;height:100%;border-radius:30px;overflow:hidden}
      #preuve-plein-ecran-root .hublot img{display:block;width:100%;height:auto}
      /* Source : le domaine seul faisait ligne de légende. Avec la marque posée
         devant, la preuve est signée. Le logo est posé tel quel — son gris est le
         « sombre secondaire » de la charte ; un masque CSS ne rend rien en headless. */
      #preuve-plein-ecran-root .source{position:relative;margin-top:auto;display:inline-flex;align-items:center;gap:18px;padding:14px 30px 14px 24px;border-radius:999px;background:#FFFEEC;box-shadow:0 12px 30px rgba(47,44,0,.12);font-size:32px;font-weight:600;opacity:0}
      #preuve-plein-ecran-root .marque{display:block;width:78px;height:auto;flex:none}
      #preuve-plein-ecran-root .sep{width:2px;height:34px;flex:none;border-radius:2px;background:rgba(185,170,2,.6)}
    </style>
    <div data-hf-id="hf-halo" class="halo"></div>
    <div data-hf-id="hf-eyeb" class="eyebrow">
      <svg data-hf-id="hf-eyes" viewBox="0 0 24 24" aria-hidden="true"><path data-hf-id="hf-eyep" d="M12 3.2 20 6.4v5.3c0 4.4-3.2 7.6-8 9.1-4.8-1.5-8-4.7-8-9.1V6.4Z"/><path data-hf-id="hf-eyeq" d="m8.6 11.9 2.5 2.5 4.4-4.7"/></svg>
      Preuve
    </div>
    <div data-hf-id="hf-076q" class="titre">Ce qu'ils voient<br data-hf-id="hf-x5px">à l'écran</div>
    <div data-hf-id="hf-uez5" class="carte">
      <div data-hf-id="hf-hubl" class="hublot"><img data-hf-id="hf-w39f" src="assets/meg-site-long.png" alt="Preuve"></div>
    </div>
    <div data-hf-id="hf-srce" class="source"><img data-hf-id="hf-mrqe" class="marque" src="assets/meg-logo.png" alt="MEG"><span data-hf-id="hf-sepe" class="sep"></span>megbusiness360.com</div>
    <script>
      window.__timelines=window.__timelines||{};
      const pfc=gsap.timeline({paused:true});
      pfc.fromTo('#preuve-plein-ecran-root .eyebrow',{y:-18,opacity:0},{y:0,opacity:1,duration:.30,ease:'power3.out'},.05)
         .fromTo('#preuve-plein-ecran-root .titre',{y:-22,opacity:0},{y:0,opacity:1,duration:.34,ease:'power3.out'},.14)
         .fromTo('#preuve-plein-ecran-root .carte',{y:56,scale:.96,opacity:0},{y:0,scale:1,opacity:1,duration:.52,ease:'power3.out'},.24)
         .fromTo('#preuve-plein-ecran-root .source',{y:14,opacity:0},{y:0,opacity:1,duration:.26},.62)
         /* Le défilement est l'argument : on descend d'un écran et demi en 3,4 s,
            assez pour qu'on voie la page vivre, assez lentement pour la lire. */
         .fromTo('#preuve-plein-ecran-root .hublot img',{y:0},{y:-1520,duration:3.4,ease:'power1.inOut'},.72);
      window.__timelines['preuve-plein-ecran']=pfc;
    </script>
  </div>
</template>
