<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Layout YouTube DÉTOURÉ — écran plein cadre, présentateur détouré
     ancré au bord bas gauche (jamais un petit PIP coin : la silhouette est
     grande). Master masqué : poser l'asset ALPHA à la place de la silhouette. -->
<div data-hf-id="hf-1fzb0" id="yt-detoure-gauche-grand-root" data-composition-id="yt-detoure-gauche-grand" data-start="0" data-duration="6" data-width="1920" data-height="1080" data-face-mode="alpha">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #yt-detoure-gauche-grand-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #yt-detoure-gauche-grand-root .fond-scene{position:absolute;inset:0;z-index:1;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%)}
      #yt-detoure-gauche-grand-root .fond-ecran{position:absolute;inset:0;z-index:1;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);display:flex;align-items:flex-start;justify-content:center;padding-top:90px}
#yt-detoure-gauche-grand-root .fond-ecran .etiquette{padding:14px 30px;border-radius:24px;background:#2F2C00;color:#FFFCD6;font-size:40px;font-weight:700;letter-spacing:.05em}

#yt-detoure-gauche-grand-root .silhouette{position:absolute;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:30px;opacity:0}
#yt-detoure-gauche-grand-root .silhouette svg{width:100%;height:auto;display:block}
#yt-detoure-gauche-grand-root .silhouette .tag{margin-top:-8px;padding:11px 24px;border-radius:20px;background:#2F2C00;color:#FFFCD6;font-size:30px;font-weight:700;letter-spacing:.04em;white-space:nowrap;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis}
    </style>
    <div data-hf-id="hf-1fzb1" class="fond-scene" data-layout-allow-occlusion=""></div>
    <div data-hf-id="hf-1fzb2" class="fond-ecran" data-layout-allow-occlusion=""><span data-hf-id="hf-1fzb3" class="etiquette">ÉCRAN PLEIN CADRE — REMPLACER</span></div>
    <div data-hf-id="hf-1fzb4" class="silhouette" style="left:-20px;top:420px;width:640px;height:660px;" data-layout-allow-occlusion="">
    <svg data-hf-id="hf-1fzb5" viewBox="0 0 200 240" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs data-hf-id="hf-1fzb6"><pattern data-hf-id="hf-1fzb7" id="hachure-sil" width="14" height="14" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><rect data-hf-id="hf-1fzb8" width="14" height="14" fill="rgba(47,44,0,.10)"></rect><rect data-hf-id="hf-1fzb9" width="7" height="14" fill="rgba(47,44,0,.20)"></rect></pattern></defs>
      <path data-hf-id="hf-1fzba" d="M100 18a44 44 0 0 1 44 44v14a44 44 0 0 1-15 33c34 12 57 38 63 74l4 57H4l4-57c6-36 29-62 63-74a44 44 0 0 1-15-33v-14a44 44 0 0 1 44-44z" fill="url(#hachure-sil)" stroke="rgba(47,44,0,.55)" stroke-width="4" stroke-dasharray="14 10"></path>
    </svg>
    <span data-hf-id="hf-1fzbb" class="tag">VISAGE DÉTOURÉ (alpha)</span>
  </div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#yt-detoure-gauche-grand-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Le visage de ce layout vient d'un asset ALPHA (fond vert détouré)
           posé à la place de la silhouette : fondu sortant rapide du master
           brut à l'entrée, fondu de retour en sortie. Le fromTo part de
           l'état naturel (visible) : rien ne fuit hors de la fenêtre du bloc.
           z-index 2 pendant le bloc : le master fond AU-DESSUS du fond de
           scène crème (z1), jamais coupé net par lui. */
        tl.set(master,{zIndex:2},0)
          .fromTo(master,{autoAlpha:1},{autoAlpha:0,duration:.16,ease:'power2.in'},0)
          .to(master,{autoAlpha:1,duration:.3,ease:'power2.out'},5.68)
          .set(master,{clearProps:'zIndex'},6.00);
      }
      tl.fromTo(root.querySelector('.fond-ecran'),{opacity:0},{opacity:1,duration:.4,ease:'power2.out'},0)
        .fromTo(root.querySelector('.silhouette'),{y:80,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.18)
        .to([root.querySelector('.fond-ecran'),root.querySelector('.silhouette')],{opacity:0,duration:.35,ease:'power2.in'},5.62);
      window.__timelines['yt-detoure-gauche-grand']=tl;
      })();
    </script>
  </div>
</body>
</html>
