<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Habillage Reel — marge latérale + titre vertical. Le master reste plein cadre, l'habillage
     se pose dessus (piste 2) et s'étire sur la durée voulue. -->
<div data-hf-id="hf-5hu00" id="reel-habillage-marge-titre-vertical-root" data-composition-id="reel-habillage-marge-titre-vertical" data-start="0" data-duration="6" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-habillage-marge-titre-vertical-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-habillage-marge-titre-vertical-root .filet{position:absolute;z-index:3;left:70px;top:180px;width:7px;height:0;border-radius:4px;background:#B9AA02}
#reel-habillage-marge-titre-vertical-root .titre-v{position:absolute;z-index:3;left:20px;top:50%;white-space:nowrap;color:#FFFCD6;font-size:44px;font-weight:700;letter-spacing:.12em;text-shadow:0 4px 24px rgba(0,0,0,.5);opacity:0}
    </style>
    <div data-hf-id="hf-5hu01" class="filet"></div><div data-hf-id="hf-5hu02" class="titre-v">SUJET DE LA VIDÉO</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-habillage-marge-titre-vertical-root');
      const tl=gsap.timeline({paused:true});
      
      gsap.set(root.querySelector('.titre-v'),{rotation:-90,xPercent:-50,yPercent:-50});
      tl.to(root.querySelector('.filet'),{height:1560,duration:.9,ease:'power2.inOut'},.05)
        .fromTo(root.querySelector('.titre-v'),{opacity:0},{opacity:1,duration:.5},.5);
      window.__timelines['reel-habillage-marge-titre-vertical']=tl;
      })();
    </script>
  </div>
</body>
</html>
