<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Intro Reel — chiffre choc. Le visage reste présent en bande basse
     (master recadré par le bloc). Remplacer les textes, garder les animations.
     Enchaîner sur un layout split une fois le hook posé. -->
<div data-hf-id="hf-1j0d0" id="reel-intro-hook-chiffre-root" data-composition-id="reel-intro-hook-chiffre" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-face-x="0" data-face-y="1300" data-face-w="1080" data-face-h="620" data-face-r="0" data-face-mode="move">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-intro-hook-chiffre-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-intro-hook-chiffre-root .scene{position:absolute;z-index:3;left:0;top:0;width:1080px;height:1300px;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:80px 70px;color:#2F2C00;text-align:center}
#reel-intro-hook-chiffre-root .couture{position:absolute;z-index:4;left:0;top:1294px;width:100%;height:6px;background:#B9AA02;box-shadow:0 0 34px rgba(185,170,2,.55)}
#reel-intro-hook-chiffre-root .titre-geant{font-size:112px;line-height:.96;font-weight:700;letter-spacing:-.03em;word-spacing:.05em}
#reel-intro-hook-chiffre-root .sous-titre{font-size:44px;font-weight:600;opacity:.62}
#reel-intro-hook-chiffre-root .gelule{display:inline-block;padding:16px 36px;border-radius:999px;background:#2F2C00;color:#FFFCD6;font-size:36px;font-weight:700;letter-spacing:.06em}
#reel-intro-hook-chiffre-root .standalone-face{display:none;position:absolute;z-index:2;left:0px;top:1300px;width:1080px;height:620px;border-radius:0px;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
    </style>
    <div data-hf-id="hf-1j0d1" class="scene" data-layout-allow-occlusion=""><div data-hf-id="hf-1j0d2" class="titre-geant" style="font-size:230px;color:#B9AA02;-webkit-text-stroke:3px #2F2C00;">87 %</div><div data-hf-id="hf-1j0d3" class="sous-titre" style="font-size:52px;opacity:1;font-weight:700;">des dossiers sont refusés<br data-hf-id="hf-1j0d4">pour cette raison</div></div>
    <div data-hf-id="hf-1j0d5" class="couture"></div>
    <div data-hf-id="hf-1j0d6" class="standalone-face" data-layout-allow-occlusion="">MASTER — BANDE VISAGE</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-intro-hook-chiffre-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Drag & drop pur : le bloc recadre le master lui-même. Entrée depuis
           le plein cadre, sortie qui LE RESTAURE — le bloc suivant repart
           toujours d'un master plein cadre. */
        tl.fromTo(master,{x:0,y:0,width:1080,height:1920,borderRadius:0},
          {x:0,y:1300,width:1080,height:620,borderRadius:0,duration:.42,ease:'power3.out'},0)
          .to(master,{x:0,y:0,width:1080,height:1920,borderRadius:0,duration:.42,ease:'power3.in'},4.58);
      }else{
        const sa=root.querySelector('.standalone-face');
        if(sa){sa.style.display='flex';tl.fromTo(sa,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'},0);}
      }
      tl.fromTo(root.querySelector('.titre-geant'),{scale:.7,opacity:0},{scale:1,opacity:1,duration:.5,ease:'back.out(1.6)'},.08)
        .fromTo(root.querySelector('.sous-titre'),{y:40,opacity:0},{y:0,opacity:1,duration:.45,ease:'power3.out'},.4);
      tl.to(root.querySelector('.scene'),{opacity:0,duration:.35,ease:'power2.in'},4.6);
      window.__timelines['reel-intro-hook-chiffre']=tl;
      })();
    </script>
  </div>
</body>
</html>
