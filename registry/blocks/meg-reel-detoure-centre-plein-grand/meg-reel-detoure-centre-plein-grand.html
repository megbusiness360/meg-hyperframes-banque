<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Layout Reel DÉTOURÉ (style fond vert) — silhouette centre, écran plein.
     Le master brut est masqué : le visage vient d'un asset ALPHA (export
     détouré) qu'on pose à la place de la silhouette hachurée. L'écran
     plein cadre passe DERRIÈRE le présentateur — le geste MrBeast/react.
     Jamais de PIP coin : la silhouette est ancrée au bord bas, grande. -->
<div data-hf-id="hf-1hnp0" id="reel-detoure-centre-plein-grand-root" data-composition-id="reel-detoure-centre-plein-grand" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-face-mode="alpha">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-detoure-centre-plein-grand-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-detoure-centre-plein-grand-root .fond-ecran{position:absolute;inset:0;z-index:1;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);display:flex;align-items:flex-start;justify-content:center;padding-top:150px}
#reel-detoure-centre-plein-grand-root .fond-ecran .etiquette{padding:14px 30px;border-radius:24px;background:#2F2C00;color:#FFFCD6;font-size:42px;font-weight:700;letter-spacing:.05em}

#reel-detoure-centre-plein-grand-root .silhouette{position:absolute;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:30px;opacity:0}
#reel-detoure-centre-plein-grand-root .silhouette svg{width:100%;height:auto;display:block}
#reel-detoure-centre-plein-grand-root .silhouette .tag{margin-top:-8px;padding:11px 24px;border-radius:20px;background:#2F2C00;color:#FFFCD6;font-size:30px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
    </style>
    <div data-hf-id="hf-1hnp1" class="fond-ecran" data-layout-allow-occlusion=""><span data-hf-id="hf-1hnp2" class="etiquette">ÉCRAN PLEIN CADRE — REMPLACER</span></div>
    <div data-hf-id="hf-1hnp3" class="silhouette" style="left:180px;top:920px;width:720px;height:1000px;" data-layout-allow-occlusion="">
    <svg data-hf-id="hf-1hnp4" viewBox="0 0 200 240" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs data-hf-id="hf-1hnp5"><pattern data-hf-id="hf-1hnp6" id="hachure-sil" width="14" height="14" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><rect data-hf-id="hf-1hnp7" width="14" height="14" fill="rgba(47,44,0,.10)"></rect><rect data-hf-id="hf-1hnp8" width="7" height="14" fill="rgba(47,44,0,.20)"></rect></pattern></defs>
      <path data-hf-id="hf-1hnp9" d="M100 18a44 44 0 0 1 44 44v14a44 44 0 0 1-15 33c34 12 57 38 63 74l4 57H4l4-57c6-36 29-62 63-74a44 44 0 0 1-15-33v-14a44 44 0 0 1 44-44z" fill="url(#hachure-sil)" stroke="rgba(47,44,0,.55)" stroke-width="4" stroke-dasharray="14 10"></path>
    </svg>
    <span data-hf-id="hf-1hnpa" class="tag">VISAGE DÉTOURÉ — REMPLACER (alpha)</span>
  </div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-detoure-centre-plein-grand-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Le visage de ce layout vient d'un asset ALPHA (fond vert détouré)
           posé à la place de la silhouette : fondu sortant rapide du master
           brut à l'entrée, fondu de retour en sortie. Le fromTo part de
           l'état naturel (visible) : rien ne fuit hors de la fenêtre du bloc. */
        tl.fromTo(master,{autoAlpha:1},{autoAlpha:0,duration:.16,ease:'power2.in'},0)
          .to(master,{autoAlpha:1,duration:.3,ease:'power2.out'},5.68);
      }
      tl.fromTo(root.querySelector('.fond-ecran'),{opacity:0},{opacity:1,duration:.4,ease:'power2.out'},0)
        .to(root.querySelector('.fond-ecran'),{opacity:0,duration:.35,ease:'power2.in'},5.62);
      tl.fromTo(root.querySelector('.silhouette'),{y:90,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.18)
        .to(root.querySelector('.silhouette'),{opacity:0,y:60,duration:.35,ease:'power2.in'},5.62);
      window.__timelines['reel-detoure-centre-plein-grand']=tl;
      })();
    </script>
  </div>
</body>
</html>
