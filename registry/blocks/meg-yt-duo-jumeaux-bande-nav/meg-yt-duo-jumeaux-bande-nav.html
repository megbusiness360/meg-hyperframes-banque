<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Layout YouTube à DEUX écrans — 2 écrans jumeaux + bande visage. Chaque zone hachurée se
     remplace indépendamment ; le bloc pilote le master. -->
<div data-hf-id="hf-1ayw0" id="yt-duo-jumeaux-bande-nav-root" data-composition-id="yt-duo-jumeaux-bande-nav" data-start="0" data-duration="6" data-width="1920" data-height="1080" data-face-x="0" data-face-y="640" data-face-w="1920" data-face-h="440" data-face-r="0" data-face-mode="move">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #yt-duo-jumeaux-bande-nav-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #yt-duo-jumeaux-bande-nav-root .fond-scene{position:absolute;inset:0;z-index:1;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%)}
      #yt-duo-jumeaux-bande-nav-root .ecran{position:absolute;z-index:3;box-sizing:border-box;border:7px solid #fffcd6;border-radius:34px;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);box-shadow:0 34px 78px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#2F2C00;overflow:hidden;opacity:0}
#yt-duo-jumeaux-bande-nav-root .ecran.bord{border:0;border-radius:0;box-shadow:none}
#yt-duo-jumeaux-bande-nav-root .ecran .etiquette{padding:12px 26px;border-radius:22px;background:#2F2C00;color:#FFFCD6;font-size:32px;font-weight:700;letter-spacing:.05em}

#yt-duo-jumeaux-bande-nav-root .ecran .barre{position:absolute;left:0;top:0;right:0;display:flex;align-items:center;gap:14px;height:88px;padding:0 26px;background:#FFFCD6;border-bottom:2px solid rgba(47,44,0,.10)}
#yt-duo-jumeaux-bande-nav-root .ecran .pastille{width:16px;height:16px;border-radius:50%;background:rgba(47,44,0,.18)}
#yt-duo-jumeaux-bande-nav-root .ecran .url{flex:1;min-width:0;margin-left:8px;padding:11px 24px;border-radius:999px;background:#FFFEEC;color:#2F2C00;font-size:28px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#yt-duo-jumeaux-bande-nav-root .face-cadre{position:absolute;z-index:5;border:7px solid #fffcd6;border-radius:30px;pointer-events:none;opacity:0}
#yt-duo-jumeaux-bande-nav-root .couture{position:absolute;z-index:4;left:0;top:634px;width:100%;height:6px;background:#B9AA02;box-shadow:0 0 34px rgba(185,170,2,.55)}
#yt-duo-jumeaux-bande-nav-root .standalone-face{display:none;position:absolute;z-index:2;left:0px;top:640px;width:1920px;height:440px;border-radius:0px;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
    </style>
    <div data-hf-id="hf-1ayw1" class="fond-scene" data-layout-allow-occlusion=""></div>
    <div data-hf-id="hf-1ayw2" class="ecran nav" style="left:40px;top:40px;width:906px;height:560px;padding-top:88px;" data-layout-allow-occlusion=""><div data-hf-id="hf-1ayw3" class="barre"><span data-hf-id="hf-1ayw4" class="pastille"></span><span data-hf-id="hf-1ayw5" class="pastille"></span><span data-hf-id="hf-1ayw6" class="pastille"></span><span data-hf-id="hf-1ayw7" class="url">megbusiness360.com</span></div><span data-hf-id="hf-1ayw8" class="etiquette">ÉCRAN 1</span></div>
    <div data-hf-id="hf-1ayw9" class="ecran nav" style="left:974px;top:40px;width:906px;height:560px;padding-top:88px;" data-layout-allow-occlusion=""><div data-hf-id="hf-1aywa" class="barre"><span data-hf-id="hf-1aywb" class="pastille"></span><span data-hf-id="hf-1aywc" class="pastille"></span><span data-hf-id="hf-1aywd" class="pastille"></span><span data-hf-id="hf-1aywe" class="url">megbusiness360.com</span></div><span data-hf-id="hf-1aywf" class="etiquette">ÉCRAN 2</span></div>
    <div data-hf-id="hf-1aywg" class="couture"></div>
    <div data-hf-id="hf-1aywh" class="standalone-face" data-layout-allow-occlusion="">MASTER CONTINU<br data-hf-id="hf-1aywi">RECADRÉ ICI</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#yt-duo-jumeaux-bande-nav-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Drag & drop pur : le bloc recadre le master lui-même. Entrée depuis
           le plein cadre, sortie qui LE RESTAURE — le bloc suivant repart
           toujours d'un master plein cadre. z-index 2 pendant le bloc : le
           master passe AU-DESSUS du fond de scène crème (z1) et SOUS les
           cartes du bloc (z3+). */
        tl.set(master,{zIndex:2},0)
          .fromTo(master,{x:0,y:0,width:1920,height:1080,borderRadius:0},
          {x:0,y:640,width:1920,height:440,borderRadius:0,duration:.42,ease:'power3.out'},0)
          .to(master,{x:0,y:0,width:1920,height:1080,borderRadius:0,duration:.42,ease:'power3.in'},5.58)
          .set(master,{clearProps:'zIndex'},6.00);
        /* Biais visage : pendant le recadrage, la fenêtre cover vise le haut
           du rush (le visage), pas le centre géométrique. Valeur d'origine
           restaurée en sortie — le bloc suivant repart d'un master intact. */
        const vid=master.querySelector('video,img');
        if(vid){
          const op0=vid.style.objectPosition||getComputedStyle(vid).objectPosition||'50% 50%';
          tl.set(vid,{objectPosition:'50% 50%'},0).set(vid,{objectPosition:op0},6.00);
        }
      }else{
        const sa=root.querySelector('.standalone-face');
        if(sa){sa.style.display='flex';tl.fromTo(sa,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'},0);}
      }
      tl.fromTo(root.querySelectorAll('.ecran'),{x:70,opacity:0,scale:.97},{x:0,opacity:1,scale:1,duration:.5,ease:'power3.out',stagger:.12},.06)
        .to(root.querySelectorAll('.ecran'),{opacity:0,x:44,duration:.35,ease:'power2.in'},5.60);
      const cadre=root.querySelector('.face-cadre');
      if(cadre)tl.fromTo(cadre,{opacity:0},{opacity:1,duration:.4,ease:'power2.out'},.2)
        .to(cadre,{opacity:0,duration:.3,ease:'power2.in'},5.62);
      window.__timelines['yt-duo-jumeaux-bande-nav']=tl;
      })();
    </script>
  </div>
</body>
</html>
