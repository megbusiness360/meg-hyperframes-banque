<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@700,600&f[]=cabinet-grotesk@400,700,800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#FFFCD6}
    *{box-sizing:border-box}
    #meg-presence-translucide-reel-root{position:relative;width:100%;height:100%;overflow:hidden;background:#FFFCD6;font-family:'Cabinet Grotesk',sans-serif;color:#2F2C00}
    #meg-presence-translucide-reel-root .fond{position:absolute;inset:0;z-index:1;background:#FFFCD6}
    #meg-presence-translucide-reel-root .preuve{position:absolute;z-index:2;inset:34px;border:3px solid #E4DCA8;border-radius:30px;overflow:hidden;background:#FFFEEC;box-shadow:0 24px 58px rgba(47,44,0,.14)}
    #meg-presence-translucide-reel-root .barre{position:absolute;left:0;right:0;top:0;height:110px;display:flex;align-items:center;gap:18px;padding:0 30px;background:#3B3B3B;border-bottom:3px solid #E4DCA8}
    #meg-presence-translucide-reel-root .pastille{width:22px;height:22px;flex:none;border-radius:50%;background:#FFFCD6}
    #meg-presence-translucide-reel-root .url{display:flex;align-items:center;gap:18px;margin-left:10px;padding:14px 26px;border-radius:999px;background:#FFFEEC;color:#2F2C00;font:700 30px/1 'Cabinet Grotesk',sans-serif;letter-spacing:.02em}
    #meg-presence-translucide-reel-root .url .trait-or{width:88px;height:9px;border-radius:9px;background:#B9AA02}
    #meg-presence-translucide-reel-root .corps{position:absolute;left:0;right:0;top:110px;bottom:0;padding:84px 58px;background:#FFFEEC}
    #meg-presence-translucide-reel-root .entete{width:66%;height:22px;border-radius:12px;background:#3B3B3B;opacity:.82}
    #meg-presence-translucide-reel-root .sous-entete{width:42%;height:14px;margin-top:20px;border-radius:10px;background:#E4DCA8}
    #meg-presence-translucide-reel-root .grille{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:72px}
    #meg-presence-translucide-reel-root .carte{height:190px;padding:28px;border:3px solid #E4DCA8;border-radius:20px;background:#FFFCD6}
    #meg-presence-translucide-reel-root .carte .trait{height:14px;margin-bottom:18px;border-radius:10px;background:#E4DCA8}
    #meg-presence-translucide-reel-root .carte .trait-court{width:62%;height:12px;border-radius:10px;background:#3B3B3B;opacity:.55}
    #meg-presence-translucide-reel-root .ligne-or{width:70%;height:12px;margin-top:70px;border-radius:12px;background:#B9AA02}
    #meg-presence-translucide-reel-root .ligne-or + .ligne-or{width:54%;margin-top:24px}
    #meg-presence-translucide-reel-root .substitut{position:absolute;z-index:4;inset:0;display:none;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);opacity:.25;pointer-events:none}
    #meg-presence-translucide-reel-root .legende{position:absolute;z-index:8;left:34px;right:34px;bottom:38px;display:flex;justify-content:center;align-items:center;min-height:62px;padding:14px 28px;border-radius:999px;background:#3B3B3B;color:#FFFEEC;font:700 27px/1 'Cabinet Grotesk',sans-serif;letter-spacing:.03em;opacity:0}
    #meg-presence-translucide-reel-root .mot-or{color:#B9AA02}
    .meg-presence-master-wrap-reel{position:absolute;z-index:6;inset:0;pointer-events:none;opacity:1}
  </style>
</head>
<body>
  <!-- Présence translucide Reel : preuve lisible en dessous, wrapper du master
       unique au-dessus. L'opacité volontairement retenue à 0,25 garde les lignes
       de preuve lisibles ; aucun clone vidéo n'est créé. -->
  <div data-hf-id="hf-b2pr0" id="meg-presence-translucide-reel-root" data-composition-id="meg-presence-translucide-reel" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-format="reel">
    <div data-hf-id="hf-b2pr1" class="fond" data-layout-allow-occlusion=""></div>
    <div data-hf-id="hf-b2pr2" class="preuve" data-layout-allow-occlusion="">
      <div data-hf-id="hf-b2pr3" class="barre"><span data-hf-id="hf-b2pr4" class="pastille"></span><span data-hf-id="hf-b2pr5" class="pastille"></span><span data-hf-id="hf-b2pr6" class="pastille"></span><span data-hf-id="hf-b2pr7" class="url"><span data-hf-id="hf-b2pr8" class="trait-or"></span>preuve.megbusiness360.com</span></div>
      <div data-hf-id="hf-b2pr9" class="corps"><div data-hf-id="hf-b2pra" class="entete"></div><div data-hf-id="hf-b2prb" class="sous-entete"></div><div data-hf-id="hf-b2prc" class="grille"><div data-hf-id="hf-b2prd" class="carte"><div data-hf-id="hf-b2pre" class="trait"></div><div data-hf-id="hf-b2prf" class="trait-court"></div></div><div data-hf-id="hf-b2prg" class="carte"><div data-hf-id="hf-b2prh" class="trait"></div><div data-hf-id="hf-b2pri" class="trait-court"></div></div></div><div data-hf-id="hf-b2prj" class="ligne-or"></div><div data-hf-id="hf-b2prk" class="ligne-or"></div></div>
    </div>
    <div data-hf-id="hf-b2prl" class="substitut" aria-hidden="true" data-layout-allow-occlusion=""></div>
    <div data-hf-id="hf-b2prm" class="legende"><span data-hf-id="hf-b2prn">preuve <span data-hf-id="hf-b2pro" class="mot-or">plein écran</span></span></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
        const LEGENDE='preuve plein écran';
        const OPACITE_MASTER=.25;
        const root=document.querySelector('#meg-presence-translucide-reel-root');
        const legende=root.querySelector('.legende');
        const substitut=root.querySelector('.substitut');
        const master=document.querySelector('#meg-master-frame');
        legende.setAttribute('aria-label',LEGENDE);
        let wrapper=null;
        if(master){
          wrapper=master.closest('.meg-presence-master-wrap-reel');
          if(!wrapper){
            wrapper=document.createElement('div');
            wrapper.id='meg-presence-master-wrap-reel';
            wrapper.className='meg-presence-master-wrap-reel';
            master.parentNode.insertBefore(wrapper,master);
            wrapper.appendChild(master);
          }
        }else{
          substitut.style.display='block';
          wrapper=substitut;
        }
        const tl=gsap.timeline({paused:true});
        tl.fromTo(wrapper,{y:18,scale:1.02,opacity:0},{y:0,scale:1,opacity:OPACITE_MASTER,duration:.6,ease:'power2.out'},0)
          .fromTo(legende,{y:18,opacity:0},{y:0,opacity:1,duration:.38,ease:'power3.out'},.34)
          .to(wrapper,{y:-16,scale:1.015,opacity:0,duration:.62,ease:'power2.in'},4.08)
          .to(legende,{y:12,opacity:0,duration:.34,ease:'power2.in'},4.34)
          .set(wrapper,{clearProps:'opacity,transform,zIndex'},5.00);
        window.__timelines['meg-presence-translucide-reel']=tl;
      })();
    </script>
  </div>
</body>
</html>
