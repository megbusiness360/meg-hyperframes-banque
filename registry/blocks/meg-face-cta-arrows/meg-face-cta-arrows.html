<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Appel à l'action — bandeau bas + chevrons.
     Les chevrons sont tracés, jamais des glyphes texte : « ↓ » dépend de la police de
     la machine et rend un trait fin et grisâtre. Chevron seul dans un jeton rond,
     bouts arrondis et angle adouci — une flèche à hampe pointue fait amateur. -->
<div data-hf-id="hf-wyjc" id="appel-action-root" data-composition-id="appel-action" data-start="0" data-duration="3" data-start="0" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('../assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #appel-action-root{position:relative;z-index:6;width:1080px;height:1920px;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #appel-action-root .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 58%,rgba(47,44,0,.70) 100%)}
      #appel-action-root .copy{position:absolute;left:0;right:0;bottom:238px;width:fit-content;max-width:780px;margin:0 auto;box-sizing:border-box;padding:26px 38px;border-radius:34px;background:#FFFCD6;color:#2F2C00;text-align:center;font-size:46px;line-height:1.04;font-weight:600;letter-spacing:-.028em;word-spacing:.04em;box-shadow:0 18px 44px rgba(47,44,0,.34);opacity:0}
      #appel-action-root .arrows{position:absolute;left:0;right:0;bottom:74px;width:fit-content;margin:0 auto;display:flex;gap:26px;opacity:0}
      /* Jeton rond : le chevron posé dans un cercle crème translucide se lit sur
         n'importe quel plan, là où un trait nu se perd dans l'image. */
      #appel-action-root .rond{display:grid;place-items:center;width:98px;height:98px;border-radius:50%;background:rgba(255,252,214,.16);border:3px solid rgba(255,252,214,.58);box-shadow:0 10px 28px rgba(47,44,0,.34)}
      #appel-action-root .rond svg{display:block;width:52px;height:52px;overflow:visible}
      #appel-action-root .rond path{fill:none;stroke:#FFFCD6;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <div data-hf-id="hf-q0n7" class="shade"></div>
    <div data-hf-id="hf-u7p0" class="copy">Cliquez sur le lien<br data-hf-id="hf-x5px">autour de cette vidéo</div>
    <div data-hf-id="hf-d642" class="arrows">
      <span data-hf-id="hf-rnd1" class="rond"><svg data-hf-id="hf-plbq" viewBox="0 0 72 72" aria-hidden="true"><path data-hf-id="hf-plb1" d="M18 28 Q36 50 54 28" /></svg></span>
      <span data-hf-id="hf-rnd2" class="rond"><svg data-hf-id="hf-9fh6" viewBox="0 0 72 72" aria-hidden="true"><path data-hf-id="hf-9fh1" d="M18 28 Q36 50 54 28" /></svg></span>
    </div>
    
    <script>
      window.__timelines=window.__timelines||{};
      const cta=gsap.timeline({paused:true});
      cta.to('#appel-action-root .arrows',{opacity:1,duration:.12},.10)
         .fromTo('#appel-action-root .rond',{y:-14,opacity:.5},{y:14,opacity:1,duration:.34,stagger:.10,repeat:5,ease:'sine.inOut'},.14)
         .to('#appel-action-root .copy',{opacity:1,y:0,duration:.30,ease:'power3.out'},.16)
         .to('#appel-action-root .copy',{opacity:0,duration:.18},2.12)
         .to('#appel-action-root .arrows',{opacity:0,duration:.18},2.12);
      window.__timelines['appel-action']=cta;
    </script>
  </div>
</body>
</html>
