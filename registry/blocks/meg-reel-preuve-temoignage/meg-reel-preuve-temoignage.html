<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Layout Reel preuve sociale — citation en carte + capture d'avis.
     Remplacer la citation (vraie, sourcée — jamais inventée : règle MEG) et
     la zone hachurée par la capture réelle de l'avis. -->
<div data-hf-id="hf-wt6p0" id="reel-preuve-temoignage-root" data-composition-id="reel-preuve-temoignage" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-face-x="0" data-face-y="1360" data-face-w="1080" data-face-h="560" data-face-r="0" data-face-mode="move">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-preuve-temoignage-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-preuve-temoignage-root .fond-scene{position:absolute;inset:0;z-index:1;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%)}
      #reel-preuve-temoignage-root .carte-cit{position:absolute;z-index:3;left:46px;top:46px;width:988px;border-radius:44px;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%);box-shadow:0 34px 78px rgba(0,0,0,.35);padding:52px 58px;color:#2F2C00;opacity:0}
#reel-preuve-temoignage-root .guillemet{font-size:120px;line-height:.6;color:#B9AA02;font-weight:700}
#reel-preuve-temoignage-root .texte-cit{margin-top:6px;font-size:48px;font-weight:600;line-height:1.16;letter-spacing:-.015em}
#reel-preuve-temoignage-root .auteur{margin-top:22px;font-size:34px;font-weight:700;color:#B9AA02}

#reel-preuve-temoignage-root .ecran{position:absolute;z-index:3;box-sizing:border-box;border:7px solid #fffcd6;border-radius:34px;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);box-shadow:0 34px 78px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#2F2C00;overflow:hidden;opacity:0}
#reel-preuve-temoignage-root .ecran.bord{border:0;border-radius:0;box-shadow:none}
#reel-preuve-temoignage-root .ecran .etiquette{padding:12px 26px;border-radius:22px;background:#2F2C00;color:#FFFCD6;font-size:32px;font-weight:700;letter-spacing:.05em}
#reel-preuve-temoignage-root .ecran .sous{font-size:23px;font-weight:600;opacity:.62;letter-spacing:-.01em}
#reel-preuve-temoignage-root .ecran .barre{position:absolute;left:0;top:0;right:0;display:flex;align-items:center;gap:14px;height:88px;padding:0 26px;background:#FFFCD6;border-bottom:2px solid rgba(47,44,0,.10)}
#reel-preuve-temoignage-root .ecran .pastille{width:16px;height:16px;border-radius:50%;background:rgba(47,44,0,.18)}
#reel-preuve-temoignage-root .ecran .url{flex:1;min-width:0;margin-left:8px;padding:11px 24px;border-radius:999px;background:#FFFEEC;color:#2F2C00;font-size:28px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reel-preuve-temoignage-root .standalone-face{display:none;position:absolute;z-index:2;left:0px;top:1360px;width:1080px;height:560px;border-radius:0px;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
#reel-preuve-temoignage-root .couture{position:absolute;z-index:4;left:0;top:1354px;width:100%;height:6px;background:#B9AA02;box-shadow:0 0 34px rgba(185,170,2,.55)}
    </style>
    <div data-hf-id="hf-wt6p1" class="fond-scene" data-layout-allow-occlusion=""></div>
    <div data-hf-id="hf-wt6p2" class="carte-cit" data-layout-allow-occlusion=""><div data-hf-id="hf-wt6p3" class="guillemet">«</div><div data-hf-id="hf-wt6p4" class="texte-cit">Citation du client à remplacer — toujours réelle et sourcée.</div><div data-hf-id="hf-wt6p5" class="auteur">Prénom N. — OF certifié</div></div>
    <div data-hf-id="hf-wt6p6" class="ecran" style="left:46px;top:700px;width:988px;height:560px;" data-layout-allow-occlusion=""><span data-hf-id="hf-wt6p7" class="etiquette">CAPTURE DE L'AVIS — REMPLACER</span><span data-hf-id="hf-wt6p8" class="sous">Google, LinkedIn, mail…</span></div>
    <div data-hf-id="hf-wt6p9" class="couture"></div>
    <div data-hf-id="hf-wt6pa" class="standalone-face" data-layout-allow-occlusion="">MASTER — BANDE VISAGE</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-preuve-temoignage-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Drag & drop pur : le bloc recadre le master lui-même. Entrée depuis
           le plein cadre, sortie qui LE RESTAURE — le bloc suivant repart
           toujours d'un master plein cadre. z-index 2 pendant le bloc : le
           master passe AU-DESSUS du fond de scène crème (z1) et SOUS les
           cartes du bloc (z3+). */
        tl.set(master,{zIndex:2},0)
          .fromTo(master,{x:0,y:0,width:1080,height:1920,borderRadius:0},
          {x:0,y:1360,width:1080,height:560,borderRadius:0,duration:.42,ease:'power3.out'},0)
          .to(master,{x:0,y:0,width:1080,height:1920,borderRadius:0,duration:.42,ease:'power3.in'},5.58)
          .set(master,{clearProps:'zIndex'},6.00);
        /* Biais visage : pendant le recadrage, la fenêtre cover vise le haut
           du rush (le visage), pas le centre géométrique. Valeur d'origine
           restaurée en sortie — le bloc suivant repart d'un master intact. */
        const vid=master.querySelector('video,img');
        if(vid){
          const op0=vid.style.objectPosition||getComputedStyle(vid).objectPosition||'50% 50%';
          tl.set(vid,{objectPosition:'50% 38%'},0).set(vid,{objectPosition:op0},6.00);
        }
      }else{
        const sa=root.querySelector('.standalone-face');
        if(sa){sa.style.display='flex';tl.fromTo(sa,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'},0);}
      }
      tl.fromTo(root.querySelector('.carte-cit'),{y:-60,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.08)
        .fromTo(root.querySelectorAll('.ecran'),{y:60,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.26)
        .to([root.querySelector('.carte-cit'),...root.querySelectorAll('.ecran')],{opacity:0,duration:.35,ease:'power2.in'},5.60);
      window.__timelines['reel-preuve-temoignage']=tl;
      })();
    </script>
  </div>
</body>
</html>
