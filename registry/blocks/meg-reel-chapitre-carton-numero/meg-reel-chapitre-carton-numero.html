<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Carton de chapitre Reel — carton numéro plein. Le master reste plein cadre,
     l'habillage passe dessus puis s'efface. Remplacer numéro et libellé. -->
<div data-hf-id="hf-gcm30" id="reel-chapitre-carton-numero-root" data-composition-id="reel-chapitre-carton-numero" data-start="0" data-duration="4" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-chapitre-carton-numero-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-chapitre-carton-numero-root .carton{position:absolute;z-index:3;left:120px;top:600px;width:840px;border-radius:44px;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%);box-shadow:0 40px 88px rgba(0,0,0,.4);padding:64px 70px;color:#2F2C00;opacity:0}
#reel-chapitre-carton-numero-root .num{font-size:150px;font-weight:700;color:#B9AA02;line-height:.9}
#reel-chapitre-carton-numero-root .chap{margin-top:14px;font-size:60px;font-weight:700;letter-spacing:-.02em;line-height:1.02}
    </style>
    <div data-hf-id="hf-gcm31" class="carton" data-layout-allow-occlusion=""><div data-hf-id="hf-gcm32" class="num">02</div><div data-hf-id="hf-gcm33" class="chap">Titre du chapitre<br data-hf-id="hf-gcm34">à remplacer</div></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-chapitre-carton-numero-root');
      const tl=gsap.timeline({paused:true});
      
      tl.fromTo(root.querySelector('.carton'),{y:70,opacity:0,scale:.95},{y:0,opacity:1,scale:1,duration:.5,ease:'power3.out'},.1)
        .to(root.querySelector('.carton'),{opacity:0,y:-50,duration:.4,ease:'power2.in'},3.4);
      window.__timelines['reel-chapitre-carton-numero']=tl;
      })();
    </script>
  </div>
</body>
</html>
