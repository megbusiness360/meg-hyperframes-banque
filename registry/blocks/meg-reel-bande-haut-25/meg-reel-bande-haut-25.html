<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Layout Reel — l'écran domine, le visage reste présent en BANDE pleine
     largeur (25 %) en haut. C'est l'alternative MEG au PIP coin (interdit) :
     le présentateur garde un vrai cadre. Remplacer la zone hachurée. -->
<div data-hf-id="hf-64ac0" id="reel-bande-haut-25-root" data-composition-id="reel-bande-haut-25" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-face-x="0" data-face-y="0" data-face-w="1080" data-face-h="480" data-face-r="0" data-face-mode="move">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-bande-haut-25-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-bande-haut-25-root .fond-scene{position:absolute;inset:0;z-index:1;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%)}
      #reel-bande-haut-25-root .grand-ecran{position:absolute;z-index:3;left:0;top:486px;width:1080px;height:1434px;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);display:flex;align-items:center;justify-content:center;opacity:0}
#reel-bande-haut-25-root .grand-ecran .etiquette{padding:14px 30px;border-radius:24px;background:#2F2C00;color:#FFFCD6;font-size:42px;font-weight:700;letter-spacing:.05em}
#reel-bande-haut-25-root .couture{position:absolute;z-index:4;left:0;width:100%;height:6px;background:#B9AA02;box-shadow:0 0 34px rgba(185,170,2,.55);top:480px}
#reel-bande-haut-25-root .standalone-face{display:none;position:absolute;z-index:2;left:0px;top:0px;width:1080px;height:480px;border-radius:0px;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
    </style>
    <div data-hf-id="hf-64ac1" class="fond-scene" data-layout-allow-occlusion=""></div>
    <div data-hf-id="hf-64ac2" class="grand-ecran" data-layout-allow-occlusion=""><span data-hf-id="hf-64ac3" class="etiquette">ÉCRAN — REMPLACER</span></div>
    <div data-hf-id="hf-64ac4" class="couture"></div>
    <div data-hf-id="hf-64ac5" class="standalone-face" data-layout-allow-occlusion="">MASTER — BANDE VISAGE</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-bande-haut-25-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Drag & drop pur : le bloc recadre le master lui-même. Entrée depuis
           le plein cadre, sortie qui LE RESTAURE — le bloc suivant repart
           toujours d'un master plein cadre. z-index 2 pendant le bloc : le
           master passe AU-DESSUS du fond de scène crème (z1) et SOUS les
           cartes du bloc (z3+). */
        tl.set(master,{zIndex:2},0)
          .fromTo(master,{x:0,y:0,width:1080,height:1920,borderRadius:0},
          {x:0,y:0,width:1080,height:480,borderRadius:0,duration:.42,ease:'power3.out'},0)
          .to(master,{x:0,y:0,width:1080,height:1920,borderRadius:0,duration:.42,ease:'power3.in'},5.58)
          .set(master,{clearProps:'zIndex'},6.00);
        /* Biais visage : pendant le recadrage, la fenêtre cover vise le haut
           du rush (le visage), pas le centre géométrique. Valeur d'origine
           restaurée en sortie — le bloc suivant repart d'un master intact. */
        const vid=master.querySelector('video,img');
        if(vid){
          const op0=vid.style.objectPosition||getComputedStyle(vid).objectPosition||'50% 50%';
          tl.set(vid,{objectPosition:'50% 38%'},0).set(vid,{objectPosition:op0},6.00);
        }
      }else{
        const sa=root.querySelector('.standalone-face');
        if(sa){sa.style.display='flex';tl.fromTo(sa,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'},0);}
      }
      tl.fromTo(root.querySelector('.grand-ecran'),{opacity:0},{opacity:1,duration:.4,ease:'power2.out'},.05)
        .to(root.querySelector('.grand-ecran'),{opacity:0,duration:.35,ease:'power2.in'},5.62);
      window.__timelines['reel-bande-haut-25']=tl;
      })();
    </script>
  </div>
</body>
</html>
