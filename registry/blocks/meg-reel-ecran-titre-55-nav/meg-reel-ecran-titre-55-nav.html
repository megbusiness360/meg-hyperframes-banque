<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Layout Reel — écran en haut, TITRE de séquence à la couture, visage
     en bas. Le titre est une vraie ligne éditable (pas un sous-titre) :
     remplacer le texte, garder le soulignement animé. -->
<div data-hf-id="hf-1omf0" id="reel-ecran-titre-55-nav-root" data-composition-id="reel-ecran-titre-55-nav" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-face-x="46" data-face-y="1170" data-face-w="988" data-face-h="704" data-face-r="34" data-face-mode="move">
    <style>
      @font-face{font-family:'Clash Grotesk MEG';src:url('assets/ClashGrotesk-Variable.woff2') format('woff2');font-weight:200 700;font-style:normal;font-display:block}
      #reel-ecran-titre-55-nav-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Clash Grotesk MEG',sans-serif}
      #reel-ecran-titre-55-nav-root .fond-scene{position:absolute;inset:0;z-index:1;background:linear-gradient(158deg,#FFFEEC 0%,#FFFCD6 52%,#F4E9A8 100%)}
      #reel-ecran-titre-55-nav-root .ecran{position:absolute;z-index:3;box-sizing:border-box;border:7px solid #fffcd6;border-radius:34px;background:repeating-linear-gradient(-45deg,#ece9cc 0 18px,#fffcd6 18px 36px);box-shadow:0 34px 78px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#2F2C00;overflow:hidden;opacity:0}
#reel-ecran-titre-55-nav-root .ecran.bord{border:0;border-radius:0;box-shadow:none}
#reel-ecran-titre-55-nav-root .ecran .etiquette{padding:12px 26px;border-radius:22px;background:#2F2C00;color:#FFFCD6;font-size:40px;font-weight:700;letter-spacing:.05em}
#reel-ecran-titre-55-nav-root .ecran .sous{font-size:29px;font-weight:600;opacity:.62;letter-spacing:-.01em}
#reel-ecran-titre-55-nav-root .ecran .barre{position:absolute;left:0;top:0;right:0;display:flex;align-items:center;gap:14px;height:88px;padding:0 26px;background:#FFFCD6;border-bottom:2px solid rgba(47,44,0,.10)}
#reel-ecran-titre-55-nav-root .ecran .pastille{width:16px;height:16px;border-radius:50%;background:rgba(47,44,0,.18)}
#reel-ecran-titre-55-nav-root .ecran .url{flex:1;min-width:0;margin-left:8px;padding:11px 24px;border-radius:999px;background:#FFFEEC;color:#2F2C00;font-size:28px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reel-ecran-titre-55-nav-root .titre-couture{position:absolute;z-index:4;left:46px;top:1020px;width:988px;text-align:center;color:#2F2C00;font-size:66px;font-weight:700;letter-spacing:-.02em;opacity:0}
#reel-ecran-titre-55-nav-root .souligne{position:absolute;z-index:4;left:50%;top:1124px;width:340px;height:9px;margin-left:-170px;border-radius:5px;background:#B9AA02;transform-origin:center}
#reel-ecran-titre-55-nav-root .face-cadre{position:absolute;z-index:5;border:7px solid #fffcd6;border-radius:34px;pointer-events:none;opacity:0}
#reel-ecran-titre-55-nav-root .standalone-face{display:none;position:absolute;z-index:2;left:46px;top:1170px;width:988px;height:704px;border-radius:34px;background:linear-gradient(180deg,#3B3B3B 0%,#2F2C00 100%);color:#FFFCD6;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
    </style>
    <div data-hf-id="hf-1omf1" class="fond-scene" data-layout-allow-occlusion=""></div>
    <div data-hf-id="hf-1omf2" class="ecran nav" style="left:46px;top:46px;width:988px;height:950px;padding-top:88px;" data-layout-allow-occlusion=""><div data-hf-id="hf-1omf3" class="barre"><span data-hf-id="hf-1omf4" class="pastille"></span><span data-hf-id="hf-1omf5" class="pastille"></span><span data-hf-id="hf-1omf6" class="pastille"></span><span data-hf-id="hf-1omf7" class="url">megbusiness360.com</span></div><span data-hf-id="hf-1omf8" class="etiquette">ÉCRAN — REMPLACER</span><span data-hf-id="hf-1omf9" class="sous">capture, démo, document</span></div>
    <div data-hf-id="hf-1omfa" class="titre-couture">Titre de la séquence</div><div data-hf-id="hf-1omfb" class="souligne"></div>
    <div data-hf-id="hf-1omfc" class="face-cadre" style="left:39px;top:1163px;width:1002px;height:718px;"></div>
    <div data-hf-id="hf-1omfd" class="standalone-face" data-layout-allow-occlusion="">MASTER CONTINU<br data-hf-id="hf-1omfe">RECADRÉ ICI</div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-ecran-titre-55-nav-root');
      const tl=gsap.timeline({paused:true});
      const master=document.querySelector('#meg-master-frame');
      if(master){
        /* Drag & drop pur : le bloc recadre le master lui-même. Entrée depuis
           le plein cadre, sortie qui LE RESTAURE — le bloc suivant repart
           toujours d'un master plein cadre. z-index 2 pendant le bloc : le
           master passe AU-DESSUS du fond de scène crème (z1) et SOUS les
           cartes du bloc (z3+). */
        tl.set(master,{zIndex:2},0)
          .fromTo(master,{x:0,y:0,width:1080,height:1920,borderRadius:0},
          {x:46,y:1170,width:988,height:704,borderRadius:34,duration:.42,ease:'power3.out'},0)
          .to(master,{x:0,y:0,width:1080,height:1920,borderRadius:0,duration:.42,ease:'power3.in'},5.58)
          .set(master,{clearProps:'zIndex'},6.00);
        /* Biais visage : pendant le recadrage, la fenêtre cover vise le haut
           du rush (le visage), pas le centre géométrique. Valeur d'origine
           restaurée en sortie — le bloc suivant repart d'un master intact. */
        const vid=master.querySelector('video,img');
        if(vid){
          const op0=vid.style.objectPosition||getComputedStyle(vid).objectPosition||'50% 50%';
          tl.set(vid,{objectPosition:'50% 36%'},0).set(vid,{objectPosition:op0},6.00);
        }
      }else{
        const sa=root.querySelector('.standalone-face');
        if(sa){sa.style.display='flex';tl.fromTo(sa,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'},0);}
      }
      tl.fromTo(root.querySelectorAll('.ecran'),{y:-70,opacity:0,scale:.97},{y:0,opacity:1,scale:1,duration:.5,ease:'power3.out',stagger:.12},.06)
        .to(root.querySelectorAll('.ecran'),{opacity:0,y:-44,duration:.35,ease:'power2.in'},5.60);
      const cadre=root.querySelector('.face-cadre');
      if(cadre)tl.fromTo(cadre,{opacity:0},{opacity:1,duration:.4,ease:'power2.out'},.2)
        .to(cadre,{opacity:0,duration:.3,ease:'power2.in'},5.62);
      tl.fromTo(root.querySelector('.titre-couture'),{y:26,opacity:0},{y:0,opacity:1,duration:.45,ease:'power3.out'},.3)
        .fromTo(root.querySelector('.souligne'),{scaleX:0},{scaleX:1,duration:.45,ease:'power2.out'},.55)
        .to([root.querySelector('.titre-couture'),root.querySelector('.souligne')],{opacity:0,duration:.3,ease:'power2.in'},5.64);
      window.__timelines['reel-ecran-titre-55-nav']=tl;
      })();
    </script>
  </div>
</body>
</html>
