<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
</head>
<body>
<!-- Habillage Reel — halo cinéma haut/bas. Le master reste plein cadre, l'habillage
     se pose dessus (piste 2) et s'étire sur la durée voulue. -->
<div data-hf-id="hf-fw210" id="reel-habillage-halo-cinema-root" data-composition-id="reel-habillage-halo-cinema" data-start="0" data-duration="6" data-width="1080" data-height="1920">
    <style>
      #reel-habillage-halo-cinema-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
      #reel-habillage-halo-cinema-root .halo-h{position:absolute;z-index:3;left:0;top:0;width:100%;height:320px;background:linear-gradient(180deg,rgba(31,29,0,.6) 0%,rgba(31,29,0,0) 100%);pointer-events:none;opacity:0}
#reel-habillage-halo-cinema-root .halo-b{position:absolute;z-index:3;left:0;bottom:0;width:100%;height:420px;background:linear-gradient(0deg,rgba(31,29,0,.66) 0%,rgba(31,29,0,0) 100%);pointer-events:none;opacity:0}
    </style>
    <div data-hf-id="hf-fw211" class="halo-h" data-layout-allow-occlusion=""></div><div data-hf-id="hf-fw212" class="halo-b" data-layout-allow-occlusion=""></div>
    <script>
      window.__timelines=window.__timelines||{};
      (()=>{
      const root=document.querySelector('#reel-habillage-halo-cinema-root');
      const tl=gsap.timeline({paused:true});
      
      tl.fromTo([root.querySelector('.halo-h'),root.querySelector('.halo-b')],{opacity:0},{opacity:1,duration:.7,ease:'power2.out'},.05);
      window.__timelines['reel-habillage-halo-cinema']=tl;
      })();
    </script>
  </div>
</body>
</html>
